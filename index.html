<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purrgress · project tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600;1,9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f1e7; --card:#fffcf7; --card2:#fff8f0; --ink:#2f2833; --muted:#968b9c; --line:#eee3d6;
  --accent:#e0795a; --accent2:#f0a98e; --accent-soft:#fbe4d9; --ok:#6fae8a; --warn:#d9962f; --bad:#d4565a;
  --blob1:#ffd9c4; --blob2:#e4d7fb; --blob3:#cdeedd;
  --shadow:0 1px 2px rgba(80,50,40,.05),0 8px 28px -6px rgba(110,70,50,.12);
  --shadow-lg:0 2px 4px rgba(80,50,40,.06),0 18px 44px -10px rgba(110,70,50,.22);
  --serif:'Fraunces',Georgia,serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16131b; --card:#211d29; --card2:#282331; --ink:#f1ebf4; --muted:#8e8499; --line:#342d3f;
        --accent:#f09373; --accent2:#e0795a; --accent-soft:#3d2d33;
        --blob1:#4a2c33; --blob2:#2f2a52; --blob3:#1d3a34;
        --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px -6px rgba(0,0,0,.5);
        --shadow-lg:0 2px 4px rgba(0,0,0,.4),0 18px 44px -10px rgba(0,0,0,.7);}
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 'Nunito',system-ui,sans-serif;min-height:100vh;
  -webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(520px 420px at 8% -5%,var(--blob1),transparent 70%),
             radial-gradient(560px 460px at 105% 8%,var(--blob2),transparent 70%),
             radial-gradient(480px 400px at 60% 108%,var(--blob3),transparent 70%)}
.wrap{max-width:740px;margin:0 auto;padding:34px 18px 100px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
header{display:flex;align-items:center;gap:16px;margin-bottom:26px}
#logo{width:58px;height:58px;border-radius:20px;background:var(--card);box-shadow:var(--shadow);font-size:32px;
  display:grid;place-items:center;user-select:none;transition:transform .2s cubic-bezier(.3,1.6,.5,1);flex:none}
#logo:hover{transform:rotate(-6deg) scale(1.05)} #logo:active{transform:scale(.88)}
.hello small{display:block;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.3px}
.hello h1{margin:0;font:italic 700 30px/1.1 var(--serif);letter-spacing:-.5px}
.hello h1 em{color:var(--accent);font-style:italic}
#bubble{margin-left:auto;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:13px;color:var(--accent);
  padding:8px 14px;border-radius:16px 16px 4px 16px;opacity:0;transform:translateY(6px) scale(.96);transition:.25s;pointer-events:none;max-width:46%}
#bubble.on{opacity:1;transform:none}

/* ---------- today strip ---------- */
#stats{display:flex;gap:10px;margin-bottom:22px}
.stat{flex:1;background:var(--card);border-radius:18px;padding:12px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column}
.stat b{font:700 26px/1.1 var(--serif);font-style:italic}
.stat span{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.3px}
.stat.bad b{color:var(--bad)} .stat.today b{color:var(--accent)} .stat.ok b{color:var(--ok)}

/* ---------- chips ---------- */
#chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;background:var(--card);
  box-shadow:var(--shadow);font-weight:700;font-size:14px;transition:.18s;user-select:none;border:1.5px solid transparent}
.chip:hover{transform:translateY(-1px);border-color:var(--c,var(--accent))}
.chip.on{background:var(--c,var(--ink));color:#fff;box-shadow:0 8px 20px -6px var(--c,var(--ink))}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.chip.on .dot{background:#fff}
.chip small{opacity:.6;font-weight:800}
.chip.add{color:var(--muted);box-shadow:none;border:1.5px dashed var(--line);background:transparent}
#newProj{padding:8px 14px;border-radius:99px;border:1.5px solid var(--accent);background:var(--card);outline:0;width:160px;font-size:14px}

/* ---------- progress ---------- */
#progress{display:flex;align-items:center;gap:12px;margin:22px 4px 18px}
#bar{flex:1;height:10px;background:var(--line);border-radius:99px;position:relative}
#fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent2),var(--accent),var(--ok));width:0;
  transition:width .6s cubic-bezier(.3,1.3,.5,1)}
#runner{position:absolute;top:-12px;font-size:21px;transition:left .6s cubic-bezier(.3,1.3,.5,1);transform:translateX(-50%) scaleX(-1)}
#pct{font-weight:800;font-size:13px;color:var(--muted);min-width:74px;text-align:right}

/* ---------- add ---------- */
#add{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:22px;padding:9px 9px 9px 20px;
  box-shadow:var(--shadow-lg);margin-bottom:26px;flex-wrap:wrap;border:1.5px solid transparent;transition:.2s}
#add:focus-within{border-color:var(--accent2)}
#title{flex:1;min-width:170px;border:0;outline:0;background:none;padding:9px 0;font-size:16px;font-weight:600}
#title::placeholder{color:var(--muted);font-weight:400}
.pick{position:relative;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:13px;background:var(--bg);
  font-size:13px;font-weight:700;color:var(--muted);white-space:nowrap;transition:.15s}
.pick:hover{background:var(--accent-soft)}
.pick input,.pick select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.pick.set{color:var(--ink)}
.pdot{display:inline-block;width:9px;height:9px;border-radius:50%}
#go{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:800;width:42px;height:42px;border-radius:14px;
  font-size:22px;transition:.2s;box-shadow:0 6px 16px -4px var(--accent)}
#go:hover{transform:scale(1.08) rotate(-5deg)}

/* ---------- toolbar ---------- */
#tools{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
#tools h2{margin:0;font:italic 700 22px var(--serif)}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px}
.seg button{padding:5px 13px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);transition:.15s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.1)}

/* ---------- tasks ---------- */
.grp{margin-top:22px}
.grp h3{margin:0 0 8px 2px;font-size:12px;font-weight:800;color:var(--muted);display:flex;gap:10px;align-items:center;
  letter-spacing:.9px;text-transform:uppercase}
.grp h3::after{content:'';flex:1;height:1px;background:var(--line)}
.grp h3.bad{color:var(--bad)} .grp h3.today{color:var(--accent)}
.grp h3 .n{background:var(--card);border-radius:99px;padding:1px 9px;font-size:11px;box-shadow:var(--shadow)}
.task{display:flex;align-items:center;gap:13px;background:var(--card);border-radius:16px;padding:12px 14px 12px 12px;margin-bottom:8px;
  box-shadow:var(--shadow);cursor:pointer;position:relative;transition:transform .18s,box-shadow .18s}
.task::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.task:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.task.new{animation:pop .4s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}}
.ck{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--c,var(--muted));display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:800;transition:.2s cubic-bezier(.3,1.6,.5,1);margin-left:4px}
.ck:hover{background:var(--accent-soft);transform:scale(1.12)}
.done .ck{background:var(--c,var(--ok))}
.txt{flex:1;min-width:0;word-break:break-word;font-weight:600}
.done .txt{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:flex;gap:6px;align-items:center;flex:none}
.pill{font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}
.cc{font-size:12px;font-weight:700;color:var(--muted);display:inline-flex;gap:3px;align-items:center}
.due{position:relative;font-size:12px;font-weight:700;color:var(--muted);padding:3px 10px;border-radius:99px;background:var(--bg);white-space:nowrap;cursor:pointer}
.due input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.due.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 13%,transparent)}
.due.today{color:var(--accent);background:var(--accent-soft)}
.due.soon{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.due.none{opacity:0}
.task:hover .due.none{opacity:.8}
.x{color:var(--muted);opacity:0;font-size:19px;line-height:1;padding:2px 4px;transition:.15s;border-radius:8px}
.task:hover .x{opacity:.8} .x:hover{color:var(--bad);opacity:1;background:color-mix(in srgb,var(--bad) 12%,transparent)}
@media (hover:none){.x{opacity:.5}.due.none{opacity:.6}}
details.donebox{margin-top:28px}
details summary{cursor:pointer;color:var(--muted);font-weight:800;font-size:12px;letter-spacing:.9px;text-transform:uppercase;margin-bottom:10px;list-style:none}
details summary::before{content:'▸ '} details[open] summary::before{content:'▾ '}
details .task{opacity:.8}

#empty{text-align:center;padding:56px 10px;color:var(--muted);font-weight:600}
#empty .big{font-size:60px;display:block;margin-bottom:8px;animation:snooze 3.2s ease-in-out infinite}
@keyframes snooze{50%{transform:translateY(-5px) rotate(-4deg)}}
footer{margin-top:40px;text-align:center;font-size:12px;color:var(--muted);opacity:.75}

/* ---------- detail drawer ---------- */
#scrim{position:fixed;inset:0;background:rgba(30,20,35,.35);backdrop-filter:blur(3px);z-index:55;opacity:0;pointer-events:none;transition:.25s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);background:var(--card);z-index:60;box-shadow:var(--shadow-lg);
  display:flex;flex-direction:column;transform:translateX(105%);transition:transform .35s cubic-bezier(.2,.9,.3,1);
  border-radius:28px 0 0 28px}
#drawer.on{transform:none}
.dh{display:flex;gap:12px;align-items:flex-start;padding:24px 22px 8px}
.dh .ck{margin-top:6px}
#dTitle{flex:1;border:0;background:none;outline:0;resize:none;font:italic 700 22px/1.25 var(--serif);padding:2px 0;overflow:hidden;min-height:34px}
#dClose{width:34px;height:34px;border-radius:12px;color:var(--muted);font-size:16px;background:var(--bg);flex:none}
#dClose:hover{color:var(--ink)}
.dmeta{display:flex;gap:8px;flex-wrap:wrap;padding:6px 22px 14px 58px;align-items:center}
#dClear{color:var(--muted);font-size:12px;font-weight:700}
#dClear:hover{color:var(--bad)}
.dbody{flex:1;overflow:auto;padding:4px 22px 10px;border-top:1px solid var(--line)}
.dbody h4{margin:16px 0 10px;font-size:12px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted)}
.cm{display:flex;gap:10px;margin-bottom:14px;animation:pop .3s ease}
.av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:color-mix(in srgb,var(--c) 18%,transparent)}
.cb{flex:1;min-width:0;background:var(--bg);border-radius:4px 16px 16px 16px;padding:9px 13px}
.ch{display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--muted)}
.ch b{color:var(--ink);font-weight:800}
.acts{margin-left:auto;display:flex;gap:10px;opacity:0;transition:.15s}
.cm:hover .acts{opacity:1}
@media (hover:none){.acts{opacity:1}}
.acts button{font-size:12px;font-weight:700;color:var(--muted)}
.acts button:hover{color:var(--accent)} .acts button[data-a=cdel]:hover{color:var(--bad)}
.ct{white-space:pre-wrap;word-break:break-word;margin-top:2px;font-size:15px}
.cedit textarea{width:100%;border:1.5px solid var(--accent2);border-radius:10px;background:var(--card);padding:7px 10px;outline:0;resize:none;margin-top:4px}
.crow{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.btn{padding:5px 13px;border-radius:10px;font-size:13px;font-weight:800;background:var(--line)}
.btn.pri{background:var(--accent);color:#fff}
.nocm{text-align:center;color:var(--muted);font-size:14px;padding:18px 0}
.nocm span{display:block;font-size:34px}
#cform{display:flex;gap:8px;padding:12px 18px 14px;border-top:1px solid var(--line);align-items:flex-end}
#cIn{flex:1;border:1.5px solid var(--line);border-radius:16px;background:var(--bg);padding:10px 14px;outline:0;resize:none;max-height:120px;transition:.15s}
#cIn:focus{border-color:var(--accent2);background:var(--card)}
#cSend{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;font-weight:800;border-radius:14px;height:42px;padding:0 16px}
.dfoot{display:flex;justify-content:space-between;align-items:center;padding:0 22px 18px;font-size:12px;color:var(--muted)}
#dDel{color:var(--bad);font-weight:800;font-size:13px;padding:6px 10px;border-radius:10px}
#dDel:hover{background:color-mix(in srgb,var(--bad) 12%,transparent)}
@media (max-width:640px){
  .wrap{padding-top:22px}
  .hello h1{font-size:25px}
  #drawer{top:auto;width:100vw;max-height:90vh;height:90vh;border-radius:28px 28px 0 0;transform:translateY(105%)}
  #drawer.on{transform:none}
  .meta .pill{display:none}
  #bubble{max-width:40%}
}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:11px 18px;
  border-radius:16px;font-weight:700;font-size:14px;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;
  transition:.3s cubic-bezier(.3,1.4,.5,1);z-index:80;box-shadow:var(--shadow-lg)}
#toast.on{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{color:var(--accent2);font-weight:800}

/* ---------- cat eggs ---------- */
.fall{position:fixed;top:-50px;z-index:90;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.paw{position:fixed;z-index:90;pointer-events:none;font-size:22px;animation:paw .8s ease-out forwards}
@keyframes paw{to{transform:translateY(-46px) scale(1.4);opacity:0}}
#walker{position:fixed;bottom:0;left:-80px;font-size:40px;z-index:40;cursor:pointer;animation:walk 14s linear forwards;user-select:none}
@keyframes walk{to{left:calc(100vw + 20px)}}
#walker span{display:inline-block;animation:bob .5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button id="logo" title="psst… pet me">🐱</button>
    <div class="hello">
      <small id="clock"></small>
      <h1 id="greet">Hello, <em>you</em></h1>
    </div>
    <div id="bubble"></div>
  </header>

  <div id="stats"></div>
  <div id="chips"></div>

  <form id="add" autocomplete="off">
    <input id="title" placeholder="Add a task…  try “send invoice fri”">
    <label class="pick" id="projPick"><span id="projLbl">Project</span><select id="projSel"></select></label>
    <label class="pick" id="datePick"><span id="dateLbl">📅 Date</span><input type="date" id="dateIn"></label>
    <button id="go" type="submit" aria-label="Add task">+</button>
  </form>

  <div id="tools">
    <h2 id="heading">All tasks</h2>
    <div class="seg"><button data-v="deadline">By deadline</button><button data-v="project">By project</button></div>
  </div>
  <div id="progress">
    <div id="bar"><div id="fill"></div><span id="runner">🐈</span></div>
    <div id="pct"></div>
  </div>

  <main id="list"></main>
  <footer>Tap a task to edit it or leave comments · double-click a project to rename or delete · saved on this device 🐾</footer>
</div>

<div id="scrim"></div>
<aside id="drawer" aria-hidden="true" aria-label="Task details">
  <div class="dh">
    <button class="ck" id="dCk" aria-label="Toggle done"></button>
    <textarea id="dTitle" rows="1" maxlength="200" aria-label="Task title"></textarea>
    <button id="dClose" aria-label="Close">✕</button>
  </div>
  <div class="dmeta">
    <label class="pick set"><span id="dProjLbl"></span><select id="dProj"></select></label>
    <label class="pick" id="dDatePick"><span id="dDateLbl"></span><input type="date" id="dDate"></label>
    <button id="dClear" hidden>clear date</button>
  </div>
  <div class="dbody">
    <h4>Comments <span id="cCount"></span></h4>
    <div id="cmts"></div>
  </div>
  <form id="cform">
    <textarea id="cIn" rows="1" placeholder="Write a comment…  (Enter to send)"></textarea>
    <button id="cSend" type="submit">Send</button>
  </form>
  <div class="dfoot"><span id="created"></span><button id="dDel">Delete task</button></div>
</aside>
<div id="toast"><span id="toastMsg"></span><button id="toastUndo">Undo</button></div>

<script>
const $ = s => document.querySelector(s);
const COLORS = ['#e0795a','#6f9fd8','#7fb893','#b48ad6','#d9a63f','#dc7595','#5fb8b8'];
const KEY = 'purrgress.v1';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayD = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = s => Math.round((parse(s) - todayD()) / 864e5);
const DOW = ['sun','mon','tue','wed','thu','fri','sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmt = s => { const d = parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
function dueLabel(s){
  const n = diff(s);
  if (n < -1) return [`${-n}d overdue`, 'bad'];
  if (n === -1) return ['Yesterday', 'bad'];
  if (n === 0) return ['Today', 'today'];
  if (n === 1) return ['Tomorrow', 'soon'];
  if (n < 7) return [`${DOW[parse(s).getDay()].replace(/^./, c => c.toUpperCase())} · ${n}d`, 'soon'];
  return [fmt(s), ''];
}
function ago(ts){
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  if (m < 1440) return `${Math.round(m/60)}h ago`;
  const d = new Date(ts); return `${MON[d.getMonth()]} ${d.getDate()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/* "send invoice fri" -> title + date */
function smartDate(text){
  const m = text.match(/^(.*?)\s+(today|tod|tomorrow|tmr|tmrw|next week|\+\d+d|sun|mon|tue|wed|thu|fri|sat)$/i);
  if (!m) return [text, ''];
  const w = m[2].toLowerCase(), t = todayD();
  let d;
  if (w.startsWith('tod')) d = t;
  else if (w.startsWith('tm')) d = addDays(t, 1);
  else if (w === 'next week') d = addDays(t, 7);
  else if (w[0] === '+') d = addDays(t, parseInt(w.slice(1)));
  else { const k = DOW.indexOf(w); d = addDays(t, ((k - t.getDay() + 6) % 7) + 1); }
  return [m[1].trim(), iso(d)];
}

/* ---------- state ---------- */
function seed(){
  const t = todayD(), P = [
    {id:uid(), name:'Brastis', color:COLORS[0]},
    {id:uid(), name:'Souvenir Brand', color:COLORS[1]},
    {id:uid(), name:'Bali Wedding Fair', color:COLORS[3]},
  ];
  const T = (p, title, off) => ({id:uid(), pid:P[p].id, title, due:off==null?'':iso(addDays(t,off)), done:false, created:Date.now(), comments:[]});
  const tasks = [
    T(0,'Finalize this week’s content plan',0), T(0,'Review product photos',2),
    T(1,'Pick packaging samples',-1), T(1,'Message the supplier',4),
    T(2,'Confirm booth layout',6), T(2,'Draft vendor list',null),
  ];
  tasks[2].comments.push({id:uid(), text:'Ask for the matte kraft option too.', at:Date.now()-36e5});
  return {projects:P, view:'deadline', filter:'all', tasks};
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
if (!S || !S.projects) S = seed();
S.tasks.forEach(t => { t.comments = t.comments || []; t.created = t.created || Date.now(); });
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };
const proj = id => S.projects.find(p => p.id === id);
const task = id => S.tasks.find(t => t.id === id);
let lastAdded = null;

/* ---------- render ---------- */
const byDue = (a, b) => (a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : 0;
const visible = () => S.tasks.filter(t => S.filter === 'all' || t.pid === S.filter);

function render(){
  const open = S.tasks.filter(t => !t.done);
  const od = open.filter(t => t.due && diff(t.due) < 0).length, td = open.filter(t => t.due && diff(t.due) === 0).length;
  const doneToday = S.tasks.filter(t => t.done).length;
  $('#stats').innerHTML =
    `<div class="stat bad"><b>${od}</b><span>overdue</span></div>
     <div class="stat today"><b>${td}</b><span>due today</span></div>
     <div class="stat ok"><b>${doneToday}</b><span>completed</span></div>`;

  $('#chips').innerHTML =
    `<button class="chip ${S.filter==='all'?'on':''}" data-f="all">All <small>${open.length}</small></button>` +
    S.projects.map(p => {
      const n = open.filter(t => t.pid === p.id).length;
      return `<button class="chip ${S.filter===p.id?'on':''}" style="--c:${p.color}" data-f="${p.id}"><span class="dot"></span>${esc(p.name)} <small>${n}</small></button>`;
    }).join('') + `<button class="chip add" id="addProj">+ project</button>`;

  const sel = $('#projSel');
  sel.innerHTML = S.projects.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('');
  sel.value = S.filter !== 'all' ? S.filter : (sel.dataset.last && proj(sel.dataset.last) ? sel.dataset.last : S.projects[0]?.id);
  syncPick();
  $('#heading').textContent = S.filter === 'all' ? 'All tasks' : proj(S.filter)?.name;
  document.querySelectorAll('.seg button').forEach(b => b.classList.toggle('on', b.dataset.v === S.view));

  const v = visible(), done = v.filter(t => t.done).length;
  const pct = v.length ? Math.round(done / v.length * 100) : 0;
  $('#fill').style.width = pct + '%';
  $('#runner').style.left = Math.max(pct, 3) + '%';
  $('#pct').textContent = v.length ? `${done}/${v.length} · ${pct}%` : '';

  const o = v.filter(t => !t.done).sort(byDue), closed = v.filter(t => t.done);
  let html = '';
  if (!o.length) {
    html = `<div id="empty"><span class="big">${v.length ? '😽' : '😺'}</span>${v.length ? 'All clear. Nap time.' : 'Nothing here yet. Add your first task!'}</div>`;
  } else if (S.view === 'deadline') {
    const G = [['Overdue','bad',t=>t.due&&diff(t.due)<0],['Today','today',t=>t.due&&diff(t.due)===0],
      ['Tomorrow','',t=>t.due&&diff(t.due)===1],['This week','',t=>t.due&&diff(t.due)>1&&diff(t.due)<=7],
      ['Later','',t=>t.due&&diff(t.due)>7],['No date','',t=>!t.due]];
    G.forEach(([name, cls, f]) => { const g = o.filter(f); if (g.length) html += group(name, cls, g); });
  } else {
    S.projects.filter(p => S.filter === 'all' || p.id === S.filter).forEach(p => {
      const g = o.filter(t => t.pid === p.id); if (g.length) html += group(p.name, '', g, p.color);
    });
  }
  if (closed.length) html += `<details class="donebox"><summary>Done · ${closed.length}</summary>${closed.map(row).join('')}</details>`;
  $('#list').innerHTML = html;
  $('#list').dataset.allDone = (!o.length && v.length) ? '1' : '';
  lastAdded = null;
}
const group = (name, cls, tasks, color) =>
  `<section class="grp"><h3 class="${cls}" ${color?`style="color:${color}"`:''}>${esc(name)} <span class="n">${tasks.length}</span></h3>${tasks.map(row).join('')}</section>`;

function row(t){
  const p = proj(t.pid) || {name:'?', color:'#999'};
  const [lbl, cls] = t.due ? dueLabel(t.due) : ['+ date', 'none'];
  const n = t.comments.length;
  return `<div class="task ${t.done?'done':''} ${t.id===lastAdded?'new':''}" data-id="${t.id}" style="--c:${p.color}">
    <button class="ck" data-a="ck" aria-label="Toggle done">${t.done?'✓':''}</button>
    <span class="txt">${esc(t.title)}</span>
    <span class="meta">
      ${n ? `<span class="cc">💬 ${n}</span>` : ''}
      ${S.view === 'deadline' && S.filter === 'all' ? `<span class="pill">${esc(p.name)}</span>` : ''}
      <label class="due ${cls}">${lbl}<input type="date" data-a="date" value="${t.due||''}"></label>
      <button class="x" data-a="del" aria-label="Delete task">×</button>
    </span></div>`;
}

/* ---------- toast / undo ---------- */
let tt, undoFn;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; undoFn = undo; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('on'), 5000);
}
$('#toastUndo').onclick = () => { undoFn && undoFn(); $('#toast').classList.remove('on'); };
function removeTask(t){
  const i = S.tasks.indexOf(t); S.tasks.splice(i, 1); save(); render();
  toast('Task deleted', () => { S.tasks.splice(i, 0, t); save(); render(); });
}

/* ---------- main events ---------- */
$('#chips').addEventListener('click', e => {
  const c = e.target.closest('.chip'); if (!c) return;
  if (c.id === 'addProj') return newProject();
  S.filter = c.dataset.f; save(); render();
});
$('#chips').addEventListener('dblclick', e => {
  const c = e.target.closest('.chip'); if (!c || !c.dataset.f || c.dataset.f === 'all') return;
  const p = proj(c.dataset.f);
  const name = prompt('Rename project (leave empty to delete it):', p.name);
  if (name === null) return;
  if (!name.trim()) {
    if (confirm(`Delete “${p.name}” and all its tasks?`)) {
      S.projects = S.projects.filter(x => x.id !== p.id);
      S.tasks = S.tasks.filter(t => t.pid !== p.id); S.filter = 'all';
    }
  } else p.name = name.trim();
  save(); render();
});
function newProject(){
  $('#addProj').outerHTML = '<input id="newProj" placeholder="Project name" maxlength="30">';
  const i = $('#newProj'); i.focus();
  let fin = false;
  const finish = ok => {
    if (fin) return; fin = true;
    const name = i.value.trim();
    if (ok && name) { const p = {id:uid(), name, color:COLORS[S.projects.length % COLORS.length]}; S.projects.push(p); S.filter = p.id; save(); }
    render();
  };
  i.addEventListener('keydown', e => { if (e.key === 'Enter') finish(true); if (e.key === 'Escape') finish(false); });
  i.addEventListener('blur', () => finish(true));
}
$('.seg').addEventListener('click', e => { const b = e.target.closest('button'); if (b){ S.view = b.dataset.v; save(); render(); } });

function syncPick(){
  const p = proj($('#projSel').value);
  $('#projLbl').innerHTML = p ? `<span class="pdot" style="background:${p.color}"></span> ${esc(p.name)}` : 'Project';
  $('#projPick').classList.toggle('set', !!p);
  const d = $('#dateIn').value;
  $('#dateLbl').textContent = d ? '📅 ' + fmt(d) : '📅 Date';
  $('#datePick').classList.toggle('set', !!d);
}
$('#projSel').addEventListener('change', e => { e.target.dataset.last = e.target.value; syncPick(); });
$('#dateIn').addEventListener('change', syncPick);

$('#add').addEventListener('submit', e => {
  e.preventDefault();
  const raw = $('#title').value.trim(); if (!raw) return;
  if (!S.projects.length) { newProject(); return; }
  let [title, due] = smartDate(raw);
  due = $('#dateIn').value || due;
  const t = {id:uid(), pid:$('#projSel').value, title, due, done:false, created:Date.now(), comments:[]};
  S.tasks.push(t); lastAdded = t.id;
  if (/\b(meow|cat|kitty|kucing|miaw)\b/i.test(raw)) { catRain(); say('MEOW! 🐾'); }
  $('#title').value = ''; $('#dateIn').value = '';
  save(); render(); $('#title').focus();
});

function toggleDone(t, x, y){
  t.done = !t.done;
  if (t.done) { if (x != null) paw(x, y); if (Math.random() < .25) say(pick(PRAISE)); }
  save(); render();
  if (t.done && $('#list').dataset.allDone) { catRain(14); say('Everything done. Treats! 🐟'); }
}
$('#list').addEventListener('click', e => {
  const r = e.target.closest('.task'); if (!r) return;
  const t = task(r.dataset.id), a = e.target.closest('[data-a]')?.dataset.a;
  if (a === 'ck') return toggleDone(t, e.clientX, e.clientY);
  if (a === 'del') return removeTask(t);
  if (e.target.closest('.due')) return;
  openTask(t.id);
});
$('#list').addEventListener('change', e => {
  if (e.target.dataset.a !== 'date') return;
  task(e.target.closest('.task').dataset.id).due = e.target.value; save(); render();
});

/* ---------- drawer: edit + comments ---------- */
let openId = null, editingCid = null;
function openTask(id){
  openId = id; editingCid = null; fillDrawer();
  $('#scrim').classList.add('on'); $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false');
  $('#cIn').value = ''; grow($('#cIn'));
}
function closeDrawer(){
  if (!openId) return;
  const t = task(openId); if (t && !t.title.trim()) t.title = 'Untitled';
  openId = null; save();
  $('#scrim').classList.remove('on'); $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true');
  render();
}
function fillDrawer(){
  const t = task(openId), p = proj(t.pid);
  $('#dTitle').value = t.title; grow($('#dTitle'));
  const ck = $('#dCk'); ck.textContent = t.done ? '✓' : ''; ck.style.setProperty('--c', p.color); ck.classList.toggle('done', t.done);
  ck.style.background = t.done ? p.color : '';
  $('#dProj').innerHTML = S.projects.map(x => `<option value="${x.id}">${esc(x.name)}</option>`).join(''); $('#dProj').value = t.pid;
  $('#dProjLbl').innerHTML = `<span class="pdot" style="background:${p.color}"></span> ${esc(p.name)}`;
  $('#dDate').value = t.due;
  const [lbl] = t.due ? dueLabel(t.due) : ['No date'];
  $('#dDateLbl').textContent = '📅 ' + lbl; $('#dDatePick').classList.toggle('set', !!t.due);
  $('#dClear').hidden = !t.due;
  const d = new Date(t.created); $('#created').textContent = `Created ${MON[d.getMonth()]} ${d.getDate()}`;
  renderComments();
}
function renderComments(){
  const t = task(openId), p = proj(t.pid), box = $('#cmts');
  $('#cCount').textContent = t.comments.length ? `· ${t.comments.length}` : '';
  box.style.setProperty('--c', p.color);
  if (!t.comments.length) { box.innerHTML = `<div class="nocm"><span>🐈‍⬛</span>No comments yet. A cat is watching.</div>`; return; }
  box.innerHTML = t.comments.map(c => `
    <div class="cm" data-cid="${c.id}" style="--c:${p.color}">
      <div class="av">🐱</div>
      <div class="cb">
        <div class="ch"><b>You</b><span>${ago(c.at)}${c.edited ? ' · edited' : ''}</span>
          ${editingCid === c.id ? '' : `<span class="acts"><button data-a="cedit">Edit</button><button data-a="cdel">Delete</button></span>`}</div>
        ${editingCid === c.id
          ? `<div class="cedit"><textarea rows="2" maxlength="1000">${esc(c.text)}</textarea><div class="crow"><button class="btn" data-a="ccancel">Cancel</button><button class="btn pri" data-a="csave">Save</button></div></div>`
          : `<div class="ct">${esc(c.text)}</div>`}
      </div>
    </div>`).join('');
  const ta = box.querySelector('textarea');
  if (ta) { grow(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
$('#dClose').onclick = $('#scrim').onclick = closeDrawer;
$('#dTitle').addEventListener('input', e => { task(openId).title = e.target.value; grow(e.target); save(); });
$('#dTitle').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
$('#dTitle').addEventListener('blur', e => { const t = task(openId); if (t && !t.title.trim()) { t.title = 'Untitled'; e.target.value = t.title; save(); } });
$('#dCk').onclick = e => { const t = task(openId); toggleDone(t, e.clientX, e.clientY); fillDrawer(); };
$('#dProj').onchange = e => { task(openId).pid = e.target.value; save(); fillDrawer(); render(); };
$('#dDate').onchange = e => { task(openId).due = e.target.value; save(); fillDrawer(); render(); };
$('#dClear').onclick = () => { task(openId).due = ''; save(); fillDrawer(); render(); };
$('#dDel').onclick = () => { const t = task(openId); closeDrawer(); removeTask(t); };

$('#cIn').addEventListener('input', e => grow(e.target));
$('#cIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#cform').requestSubmit(); } });
$('#cform').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('#cIn').value.trim(); if (!text) return;
  const t = task(openId); t.comments.push({id:uid(), text, at:Date.now()});
  $('#cIn').value = ''; grow($('#cIn')); save(); renderComments(); render();
  const b = document.querySelector('.dbody'); b.scrollTop = b.scrollHeight;
  if (/\b(meow|cat|kitty)\b/i.test(text)) { catRain(12); say('Meow to you too 🐾'); }
});
$('#cmts').addEventListener('click', e => {
  const a = e.target.closest('[data-a]')?.dataset.a, cm = e.target.closest('.cm'); if (!a || !cm) return;
  const t = task(openId), c = t.comments.find(x => x.id === cm.dataset.cid);
  if (a === 'cedit') { editingCid = c.id; renderComments(); }
  if (a === 'ccancel') { editingCid = null; renderComments(); }
  if (a === 'csave') saveComment(cm, t, c);
  if (a === 'cdel') {
    const i = t.comments.indexOf(c); t.comments.splice(i, 1); save(); renderComments(); render();
    toast('Comment deleted', () => { t.comments.splice(i, 0, c); save(); if (openId === t.id) renderComments(); render(); });
  }
});
$('#cmts').addEventListener('keydown', e => {
  const ta = e.target.closest('.cedit textarea'); if (!ta) return;
  const cm = ta.closest('.cm'), t = task(openId), c = t.comments.find(x => x.id === cm.dataset.cid);
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveComment(cm, t, c); }
  if (e.key === 'Escape') { e.stopPropagation(); editingCid = null; renderComments(); }
});
function saveComment(cm, t, c){
  const v = cm.querySelector('textarea').value.trim();
  if (v && v !== c.text) { c.text = v; c.edited = true; save(); }
  editingCid = null; renderComments();
}
addEventListener('keydown', e => { if (e.key === 'Escape' && openId && !e.defaultPrevented) closeDrawer(); });

/* ---------- clock ---------- */
let lastDay = iso(new Date());
function tick(){
  const d = new Date(), h = d.getHours();
  $('#clock').textContent = `${d.toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long'})} · ${pad(h)}:${pad(d.getMinutes())}`;
  $('#greet').innerHTML = `Good ${h < 12 ? 'morning' : h < 18 ? 'afternoon' : 'evening'}, <em>you</em>`;
  if (iso(d) !== lastDay) { lastDay = iso(d); render(); }
}
tick(); setInterval(tick, 20000);

/* ---------- cats ---------- */
const PRAISE = ['Purr-fect! 😻','Nice paw-ork! 🐾','You’re on a roll 🐈','Meow-velous! ✨','Another one down 😸'];
const MEOWS = ['meow~','prrrr…','*slow blink* 😌','feed me? 🐟','mrrp!','you’re doing great 💛','nap after this?'];
const pick = a => a[Math.floor(Math.random() * a.length)];
let bt;
function say(msg){ const b = $('#bubble'); b.textContent = msg; b.classList.add('on'); clearTimeout(bt); bt = setTimeout(() => b.classList.remove('on'), 2400); }
function paw(x, y){ const p = document.createElement('span'); p.className = 'paw'; p.textContent = '🐾'; p.style.left = x - 10 + 'px'; p.style.top = y - 10 + 'px'; document.body.appendChild(p); setTimeout(() => p.remove(), 900); }
function catRain(n = 28){
  const set = ['🐱','😺','😸','😻','🐈','🐈‍⬛','🐾','😽'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); s.className = 'fall'; s.textContent = pick(set);
    s.style.left = Math.random() * 96 + 'vw'; s.style.fontSize = 20 + Math.random() * 26 + 'px';
    s.style.animationDuration = 2.2 + Math.random() * 2.2 + 's'; s.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 6000);
  }
}
let pets = 0, petT;
$('#logo').addEventListener('click', () => {
  pets++; clearTimeout(petT); petT = setTimeout(() => pets = 0, 1500);
  if (pets >= 7) { pets = 0; catRain(); say('Cat party! 🎉'); } else say(pick(MEOWS));
});
function walker(){
  if (document.hidden) return schedule();
  const w = document.createElement('div'); w.id = 'walker'; w.innerHTML = '<span>🐈</span>'; document.body.appendChild(w);
  w.onclick = () => { say('prrrrr… 💕'); paw(w.getBoundingClientRect().left + 20, innerHeight - 60); };
  w.onanimationend = () => { w.remove(); schedule(); };
}
const schedule = () => setTimeout(walker, 45000 + Math.random() * 60000);
setTimeout(walker, 20000);
let buf = '';
addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea,[contenteditable="true"]')) return;
  buf = (buf + e.key).slice(-4).toLowerCase();
  if (buf === 'meow') { catRain(); say('MEOW! 🐾'); }
});

render();
</script>
</body>
</html>
