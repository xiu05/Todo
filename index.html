<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purrgress · Plan · Focus · Achieve</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%23F2EAD9'/><path d='M27 47C25 31 29 21 33 15L43 23C48 21 52 21 57 23L67 15C71 21 75 31 73 47Z' fill='%232B2019'/><circle cx='42' cy='35' r='2.6' fill='%23F2EAD9'/><circle cx='58' cy='35' r='2.6' fill='%23F2EAD9'/><rect x='20' y='45' width='60' height='38' rx='8' fill='%23F2EAD9' stroke='%232B2019' stroke-width='5'/><path d='M31 58l4 4 7-8M31 72l4 4 7-8M50 59h20M50 73h20' stroke='%232B2019' stroke-width='4' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,:root[data-theme=dark]{
  --paper:#2B2019; --paper2:#33271e; --card:#382c22; --soft:#443728; --ink:#F2EAD9; --muted:#ad9d86;
  --line:rgba(242,234,217,.17); --accent:#E36A4A; --orange:#E36A4A; --yellow:#F4C542; --ytext:#F4C542; --red:#E0716B; --green:#82b58f;
  --grain:.10; --blend:screen; --patop:.09;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 60px -20px rgba(0,0,0,.65);
  --disp:'Nunito','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
:root[data-theme=light]{
  --paper:#F2EAD9; --paper2:#f7f0e2; --card:#fcf8ee; --soft:#efe4cf; --ink:#2B2019; --muted:#8d7a66;
  --line:rgba(43,32,25,.17); --accent:#C75252; --red:#C75252; --ytext:#b88908; --green:#5f9d6e;
  --grain:.45; --blend:multiply; --patop:.07;
  --shadow:0 1px 2px rgba(43,32,25,.06),0 24px 60px -20px rgba(43,32,25,.28);
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--paper);overflow-x:hidden}
body{background:linear-gradient(180deg,var(--paper2),var(--paper) 55%);background-attachment:fixed;color:var(--ink);
  font:16px/1.45 var(--disp);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--grain);mix-blend-mode:var(--blend);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .12 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
body::after{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--patop);background-image:var(--pattern);background-size:240px}
.wrap{max-width:1080px;margin:0 auto;padding:18px 18px 120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font:500 12px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase}

/* status colours */
.s-todo{--sc:var(--muted)} .s-doing{--sc:var(--ytext)} .s-review{--sc:var(--orange)} .s-blocked{--sc:var(--red)} .s-done{--sc:var(--green)} .s-hold{--sc:#a08a6a}

/* ---------- nav ---------- */
.nav{display:flex;align-items:center;gap:18px;margin-bottom:6px}
#logo{display:block;color:var(--ink);transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
#logo svg{display:block;height:46px;width:auto;overflow:visible}
#logo:hover{transform:rotate(-2deg) scale(1.04)} #logo:active{transform:scale(.94)}
#themeBtn{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);color:var(--muted);text-align:center;font-size:15px;transition:.15s}
#themeBtn:hover{border-color:var(--ink);color:var(--ink)}
.tabs{margin-left:auto;display:flex;gap:4px;align-items:center}
.tabs button{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:99px;border:1.5px solid transparent;color:var(--muted);transition:.15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{border-color:var(--ink);color:var(--ink)}
#clock{color:var(--muted)}
#saved{opacity:0;transition:opacity .3s;color:var(--green);white-space:nowrap}
#saved.ok{opacity:1} #saved.bad{opacity:1;color:var(--red)}
#bubble{position:fixed;top:66px;right:18px;z-index:70;background:var(--ink);color:var(--paper);font:500 12px var(--mono);letter-spacing:.04em;
  padding:9px 14px;border-radius:14px 14px 3px 14px;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
#bubble.on{opacity:1;transform:none}

/* ---------- stage: arc of brands ---------- */
#stage{position:relative;height:284px;margin-bottom:-6px;overflow-x:clip}
#arcLabel{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--card);border:1.5px solid var(--ink);border-radius:10px;
  padding:6px 14px;font:600 14px var(--disp);box-shadow:0 8px 20px -10px rgba(58,36,24,.4);white-space:nowrap;z-index:20;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
#tiles{position:absolute;left:50%;top:84px;width:0;height:0}
.tile{position:absolute;left:0;top:0;width:74px;height:74px;border-radius:22px;background:var(--t,var(--soft));display:grid;place-items:center;
  font-size:36px;transition:transform .55s cubic-bezier(.25,1,.35,1),opacity .35s,background .3s;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),inset 0 5px 0 rgba(255,255,255,.35),0 10px 18px -8px rgba(58,36,24,.5)}
.tile.on{box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),inset 0 5px 0 rgba(255,255,255,.35),0 18px 30px -10px rgba(58,36,24,.6)}
.tile:hover:not(.on){filter:brightness(1.07)}
.tile .em{filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.tile .cnt{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:99px;background:var(--ink);color:var(--paper);
  font:500 11px/22px var(--mono);text-align:center;padding:0 5px}
.tile.plus{background:transparent;border:2px dashed var(--muted);color:var(--muted);box-shadow:none;font:300 36px var(--disp)}
.arrow{position:absolute;top:166px;width:46px;height:46px;border-radius:50%;background:var(--ink);color:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;
  font-size:20px;transition:.15s;z-index:20}
.arrow:hover{transform:scale(1.1)}
#prev{left:max(0px,calc(50% - 400px))} #next{right:max(0px,calc(50% - 400px))}

/* ---------- card ---------- */
.card{position:relative;background:var(--card);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:230px 1fr;min-height:540px}
.dialcol{position:relative}
.dial{position:absolute;left:-170px;top:50%;width:430px;height:430px;margin-top:-215px}
.dial .trk0{fill:none;stroke:var(--line);stroke-width:2}
.dial .arc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .8s}
.dial .knob{fill:var(--accent);stroke:var(--card);stroke-width:3}
.dial .spin{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dpct{font:900 44px var(--disp);fill:var(--ink);letter-spacing:-.04em}
.dlbl{font:500 11px var(--mono);fill:var(--muted);letter-spacing:.14em}
.main{padding:34px 34px 30px 8px;min-width:0}
.top{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;border-bottom:3px solid var(--ink)}
.ttl{padding-bottom:18px;min-width:0}
.ttl>.mono{color:var(--muted);display:block;margin-bottom:10px}
.big{margin:0;font:900 var(--fs,100px)/.92 var(--disp);letter-spacing:-.035em;overflow-wrap:break-word;cursor:text}
.stks{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.stk{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:99px;padding:4px 12px;transform:rotate(-2deg)}
.stk:nth-child(2){transform:rotate(1.5deg)} .stk:nth-child(3){transform:rotate(-1deg)} .stk:nth-child(4){transform:rotate(1deg)}
.stk:first-child{background:var(--ink);color:var(--card)}
.stk.warn{border-color:var(--red);color:var(--red)}
.fine{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.fine button{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid transparent}
.fine button:hover{color:var(--ink);border-color:var(--ink)}

/* buttons */
.cta{background:var(--ink);color:var(--card);font:800 14px var(--disp);padding:8px 18px;border-radius:99px;white-space:nowrap;
  transition:transform .15s}
.cta:hover{transform:translateY(-1px) rotate(-1deg)}
.btn{padding:6px 16px;border-radius:99px;font:800 14px var(--disp);border:1.5px solid var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:var(--card)} .btn.pri:hover{background:var(--ink);opacity:.9}
.btn.dng{border-color:var(--red);color:var(--red)} .btn.dng:hover{background:var(--red);color:var(--card)}

/* brand edit */
.be{padding-bottom:20px}
.be>.mono{color:var(--accent);display:block;margin-bottom:8px}
#beName{width:100%;border:0;border-bottom:3px solid var(--ink);background:none;outline:0;font:900 56px/1 var(--disp);letter-spacing:-.035em;padding:0 0 8px;min-width:0}
.sw,.mk{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.swb{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.swb.on{box-shadow:0 0 0 2.5px var(--ink)}
.mkb{width:38px;height:38px;border-radius:12px;font-size:20px;border:1.5px solid var(--line);text-align:center}
.mkb.on{border-color:var(--ink);background:var(--soft)}
.berow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.berow .dng{margin-left:auto}

/* cat */
.catwrap{position:relative;width:196px;margin-bottom:-3px;cursor:pointer;user-select:none}
.cat{display:block;width:100%;color:var(--ink);overflow:visible}
.cat .fillp{fill:var(--card)}
.cat .eyes{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .12s}
.cat .eyes circle{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.cat .tail{transform-origin:168px 168px;animation:wag 3.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
.catwrap:hover .tail{animation-duration:.7s}
.cat .wh{transform-origin:110px 110px;animation:wh 4s ease-in-out infinite}
@keyframes wh{50%{transform:scaleX(1.03)}}
.cat.meow{animation:meow .5s}
@keyframes meow{30%{transform:translateY(-8px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
.zz{font:500 20px var(--mono);fill:var(--muted);animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translateY(8px)}50%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.badge{position:absolute;left:-58px;top:-8px;width:88px;pointer-events:none}
.badge .ring{transform-origin:60px 60px;animation:spin 20s linear infinite}
.badge text{font:500 9.4px var(--mono);fill:#2B2019;letter-spacing:.05em}

/* ---------- tracklist ---------- */
.lbl{display:flex;justify-content:space-between;align-items:center;color:var(--accent);margin:20px 0 6px;min-height:30px}
.lbl>span:last-child{color:var(--muted)}
.trk{border-bottom:1px solid var(--line)}
.trow{display:grid;grid-template-columns:34px 1fr 90px 112px 32px;gap:14px;align-items:center;width:100%;padding:13px 6px;border-radius:12px;transition:background .15s;cursor:pointer}
.trow:hover{background:var(--soft)}
.no{font:500 12px var(--mono);color:var(--muted)}
.tn{min-width:0;display:flex;flex-direction:column}
.tn b{font:800 19px/1.15 var(--disp);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn{width:100%;border:0;border-bottom:2px solid var(--ink);background:none;outline:0;font:700 19px/1.15 var(--disp);letter-spacing:-.02em;padding:0 0 2px}
.sub{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sc);margin-right:6px}
.mbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .5s}
.tdue{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;text-align:right;color:var(--muted);white-space:nowrap}
.tdue.bad,.due.bad{color:var(--red)} .tdue.today,.due.today{color:var(--ink);text-decoration:underline wavy var(--yellow) 2px;text-underline-offset:4px}
.trk.open .trow .tn b{color:var(--c)}
.tbody{padding:2px 0 16px 48px;animation:drop .3s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.ptool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 8px 8px}
.ptool .sp{flex:1}
.ptool .lnk{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ptool .lnk:hover{color:var(--ink)} .ptool .lnk.dng:hover{color:var(--red)}
.st{position:relative;display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--sc,var(--muted));
  padding:3px 10px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--sc,var(--muted)) 45%,transparent);cursor:pointer;white-space:nowrap;transition:.15s}
.st:hover{background:color-mix(in srgb,var(--sc,var(--muted)) 12%,transparent)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--muted))}
.st select,.pick select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chipb{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.chipb:hover{border-color:var(--ink);color:var(--ink)} .chipb.set{color:var(--ink)}
.tk{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.tk:hover{background:var(--soft)}
.tk.new{animation:drop .4s cubic-bezier(.3,1.5,.5,1)}
.ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--c,var(--ink));display:grid;place-items:center;color:var(--card);font:800 13px var(--disp);transition:.2s cubic-bezier(.3,1.6,.5,1)}
.ck:hover{transform:scale(1.15)}
.s-doing>.ck{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.s-review>.ck{background:conic-gradient(var(--c) 0 75%,transparent 0)}
.s-blocked>.ck{border-color:var(--red);color:var(--red)}
.done>.ck{background:var(--c,var(--ink))}
.txt{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.done .txt{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:flex;gap:10px;align-items:center;flex:none}
.cc{font:500 11.5px var(--mono);color:var(--muted)}
.ctx{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--c);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.due{font:500 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;padding:3px 4px;border-radius:8px;min-width:58px;text-align:right}
.due:hover{background:var(--line);color:var(--ink)}
.due.none{opacity:0} .tk:hover .due.none{opacity:.8}
.due.soon{color:var(--ytext)}
.x{color:var(--muted);opacity:0;font-size:18px;line-height:1;padding:2px 5px;border-radius:8px;transition:.15s}
.tk:hover .x{opacity:.8} .x:hover{color:var(--red);opacity:1}
@media (hover:none){.x{opacity:.5}.due.none{opacity:.6}}
.addt{display:flex;gap:10px;align-items:center;margin-top:4px}
.addt input,.newp input{flex:1;min-width:0;border:0;border-bottom:1.5px dashed var(--line);background:none;outline:0;padding:10px 8px;font:500 13px var(--mono);letter-spacing:.02em}
.addt input:focus,.newp input:focus{border-bottom-color:var(--ink)}
.newp{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line)}
.grp{margin-top:20px}
.grp h3{margin:0 0 4px;display:flex;justify-content:space-between;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grp h3.bad{color:var(--red)} .grp h3.today{color:var(--ink)}
.empty{padding:26px 0;color:var(--muted);font:500 13px var(--mono);letter-spacing:.04em;text-transform:uppercase;text-align:center}
.illo{display:block;width:120px;margin:0 auto 10px;color:var(--ink);opacity:.9}
.nocm .illo{width:96px}
.nbForm{padding:40px 0}
.nbForm input{width:100%;border:0;border-bottom:3px solid var(--ink);background:none;outline:0;font:900 80px/1 var(--disp);letter-spacing:-.035em;padding:0 0 10px;min-width:0}
.nbForm input::placeholder{color:var(--line)}
.nbForm p{margin-top:14px;color:var(--muted)}
footer{margin-top:26px;text-align:center;color:var(--muted)}

/* ---------- calendar view ---------- */
.cwd{display:grid;grid-template-columns:repeat(7,1fr);margin:16px 0 6px;color:var(--muted);text-align:center;font-size:11px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cday{min-height:84px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0;transition:background .15s}
.cday:hover{background:var(--soft)} .cday.out{opacity:.42} .cday.sel{background:var(--soft);box-shadow:inset 0 0 0 2px var(--ink)}
.cday .dn{font:500 12px var(--mono);align-self:flex-start}
.cday.today .dn{background:var(--ink);color:var(--card);border-radius:99px;padding:1px 7px}
.cchips{display:flex;flex-direction:column;gap:3px;min-width:0}
.cchip{font:600 11px/1.25 var(--disp);border-left:3px solid var(--c);padding:1px 5px;background:color-mix(in srgb,var(--c) 15%,transparent);border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cchip.done{text-decoration:line-through;opacity:.5}
.cmore{font:500 10px var(--mono);color:var(--muted)}
.cdots{display:none;gap:3px;flex-wrap:wrap}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* ---------- date popover ---------- */
#calpop{position:fixed;z-index:100;width:288px;background:var(--card);border:2px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:12px;animation:drop .2s ease}
.cph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cph b{font:700 16px var(--disp)}
.cph button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);text-align:center}
.cph button:hover{border-color:var(--ink)}
.cpw,.cpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cpw span{font:500 10px var(--mono);color:var(--muted);padding:4px 0}
.cpg button{aspect-ratio:1;border-radius:50%;font:600 13px var(--disp);position:relative;text-align:center}
.cpg button:hover{background:var(--soft)}
.cpg .out{color:var(--muted);opacity:.55}
.cpg .tod{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cpg .on{background:var(--ink);color:var(--card)}
.cpg .has::after{content:'';position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cpq{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cpq button{font:500 11px var(--mono);text-transform:uppercase;padding:5px 10px;border-radius:99px;border:1.5px solid var(--line)}
.cpq button:hover{border-color:var(--ink)} .cpq .clr{margin-left:auto;color:var(--accent)}

/* ---------- quick add ---------- */
#fab{position:fixed;right:20px;bottom:20px;z-index:50;background:var(--ink);color:var(--card);border-radius:99px;padding:12px 22px 12px 16px;font:800 16px var(--disp);
  display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);transition:transform .2s}
#fab span{font:400 24px/1 var(--disp)} #fab:hover{transform:translateY(-2px) rotate(-1deg)}
#qa{position:fixed;right:20px;bottom:78px;width:min(410px,calc(100vw - 24px));z-index:66;background:var(--card);border:2px solid var(--ink);border-radius:22px;

<script>
const $ = s => document.querySelector(s);
const COLORS = ['#E36A4A','#F4C542','#C75252','#8fb6dc','#a8b64a','#d9b98f','#c3a2dd'];
const MARKS = ['🐱','😺','🐈','😸','🐈‍⬛','😻','😼'];
const KEY = 'purrgress.v2';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };

/* ---------- statuses ---------- */
const ST  = [['todo','Not started'],['doing','In progress'],['review','In review'],['blocked','Blocked'],['done','Done']];
const PST = [['todo','Not started'],['doing','In progress'],['hold','On hold'],['done','Done']];
const stLabel = (s, list = ST) => (list.find(x => x[0] === s) || list[0])[1];
const opts = (cur, list) => list.map(([k, l]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${l}</option>`).join('');

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayD = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = s => Math.round((parse(s) - todayD()) / 864e5);
const DOW = ['sun','mon','tue','wed','thu','fri','sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt = s => { const d = parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = s => { const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
function dueInfo(s){
  if (!s) return ['+ date', 'none'];
  const n = diff(s);
  if (n < -1) return [`${-n}d late`, 'bad'];
  if (n === -1) return ['Yesterday', 'bad'];
  if (n === 0) return ['Today', 'today'];
  if (n === 1) return ['Tomorrow', 'soon'];
  if (n < 7) return [`${DOW[parse(s).getDay()]} · ${n}d`, 'soon'];
  return [fmt(s), ''];
}
function ago(ts){
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  if (m < 1440) return `${Math.round(m/60)}h ago`;
  const d = new Date(ts); return `${MON[d.getMonth()]} ${d.getDate()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/* "send invoice fri" -> title + date */
function smartDate(text){
  const m = text.match(/^(.*?)\s+(today|tod|tomorrow|tmr|tmrw|next week|\+\d+d|sun|mon|tue|wed|thu|fri|sat)$/i);
  if (!m) return [text, ''];
  const w = m[2].toLowerCase(), t = todayD();
  let d;
  if (w.startsWith('tod')) d = t;
  else if (w.startsWith('tm')) d = addDays(t, 1);
  else if (w === 'next week') d = addDays(t, 7);
  else if (w[0] === '+') d = addDays(t, parseInt(w.slice(1)));
  else { const k = DOW.indexOf(w); d = addDays(t, ((k - t.getDay() + 6) % 7) + 1); }
  return [m[1].trim(), iso(d)];
}

/* ---------- state: brands → projects → tasks ---------- */
function seed(){
  const t = todayD();
  const B = [['Brastis',0],['Souvenir Brand',1],['Bali Wedding Fair',2]].map(([name,i]) => ({id:uid(), name, color:COLORS[i], mark:MARKS[i]}));
  const P = [[0,'Spring Campaign','doing'],[0,'Website Revamp','todo'],[1,'Packaging','doing'],[1,'Batch 02 Production','todo'],[2,'Booth & Layout','todo'],[2,'Vendors','todo']]
    .map(([b,name,status]) => ({id:uid(), bid:B[b].id, name, status, due:''}));
  const T = (p, title, off, status = 'todo') => ({id:uid(), pid:P[p].id, title, due:off==null?'':iso(addDays(t,off)), status, done:status==='done', created:Date.now(), comments:[]});
  const tasks = [
    T(0,'Finalize content plan',0,'doing'), T(0,'Review product photos',2), T(0,'Brief the photographer',-1,'done'),
    T(1,'Pick homepage layout',5), T(1,'Write about-us copy',9),
    T(2,'Pick packaging samples',-1,'blocked'), T(2,'Approve final dieline',3,'review'),
    T(3,'Confirm quantity with supplier',4), T(3,'Schedule QC check',12),
    T(4,'Confirm booth layout',6), T(4,'Order banners',8),
    T(5,'Draft vendor list',null), T(5,'Email top 5 vendors',1),
  ];
  tasks[5].comments.push({id:uid(), text:'Waiting on the supplier to send the matte kraft option.', at:Date.now()-36e5});
  P[0].due = iso(addDays(t, 10));
  return {brands:B, projects:P, tasks, tab:'brands', brand:B[0].id, open:null};
}
function migrate(old){ // v1 had flat projects → they become brands with one "General" project
  const brands = old.projects.map((p,i) => ({id:p.id, name:p.name, color:COLORS[i%COLORS.length], mark:MARKS[i%MARKS.length]}));
  const projects = brands.map(b => ({id:'g'+b.id, bid:b.id, name:'General'}));
  const tasks = old.tasks.map(t => ({...t, pid:'g'+t.pid}));
  return {brands, projects, tasks, tab:'brands', brand:brands[0]?.id || '+', open:null};
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
if (!S) { try { if (window.name.startsWith('purrgress:')) S = JSON.parse(window.name.slice(10)); } catch(e){} }
if (!S || !S.brands) {
  let old; try { old = JSON.parse(localStorage.getItem('purrgress.v1')); } catch(e){}
  S = old && old.projects ? migrate(old) : seed();
}
S.tasks.forEach(t => { t.comments = t.comments || []; t.created = t.created || Date.now(); t.status = t.status || (t.done ? 'done' : 'todo'); t.done = t.status === 'done'; });
S.projects.forEach(p => { p.due = p.due || ''; if (!p.status) { const ts = S.tasks.filter(t => t.pid === p.id); p.status = ts.length && ts.every(t => t.done) ? 'done' : ts.some(t => t.status !== 'todo') ? 'doing' : 'todo'; } });
const now = new Date();
S.cal = S.cal || {y:now.getFullYear(), m:now.getMonth(), sel:iso(now)};
if (!['brands','calendar','deadlines'].includes(S.tab)) S.tab = 'brands';
S.music = S.music || {tracks:[], idx:0};
S.pet = Object.assign({on:true, name:'', love:30, treats:0, done:0, seeded:false, asked:false}, S.pet || {});
S.pet.friend = Object.assign({on:true, name:'Pudding', seen:false}, S.pet.friend || {});
if (!S.pet.seeded) { S.tasks.forEach(t => { if (t.done) { t.credited = true; S.pet.done++; } }); S.pet.seeded = true; }
S.pet.look = Object.assign({fur:'auto', pattern:'plain', acc:null}, S.pet.look || {});
if (S.pet.look.acc === null) S.pet.look.acc = S.pet.done >= 20 ? 'crown' : S.pet.done >= 5 ? 'bow' : 'none';
S.pet.friend.look = Object.assign({fur:'#E8914F', pattern:'stripes', acc:'none'}, S.pet.friend.look || {});
S.projects.forEach(p => { p.sessions = p.sessions || []; });
S.pomoSet = Object.assign({on:false, f:25, b:5, l:15, every:4}, S.pomoSet || {});
if (S.timer && !S.projects.some(p => p.id === S.timer.pid)) S.timer = null;
if (S.brand !== '+' && !S.brands.some(b => b.id === S.brand)) S.brand = S.brands[0]?.id || '+';
S.adding = false; S.edit = null;
let SYNC = {pass:'', at:0, dirty:false};
try { Object.assign(SYNC, JSON.parse(localStorage.getItem('purrgress.sync')) || {}); } catch(e){}
SYNC.status = SYNC.pass ? 'syncing' : 'off'; SYNC.applying = false; SYNC.conflict = null; SYNC.msg = '';
const saveSync = () => { try { const {status, applying, conflict, msg, ...rest} = SYNC; localStorage.setItem('purrgress.sync', JSON.stringify(rest)); } catch(e){} };
let saveOK = true, savedT;
function save(){
  const {adding, edit, ...rest} = S, j = JSON.stringify(rest);
  try { localStorage.setItem(KEY, j); saveOK = localStorage.getItem(KEY) === j; } catch(e){ saveOK = false; }
  if (!saveOK) { try { window.name = 'purrgress:' + j; } catch(e){} } // last-resort: survives reloads of this tab
  if (!SYNC.applying) onSaved();
  const el = $('#saved'); if (!el) return;
  el.className = 'mono' + (saveOK ? ' ok' : ' bad');
  el.textContent = saveOK ? 'Saved ✓' : '⚠ Not saved — open in a normal tab';
  clearTimeout(savedT); if (saveOK) savedT = setTimeout(() => el.classList.remove('ok'), 1800);
}
const brandOf = id => S.brands.find(b => b.id === id);
const projOf = id => S.projects.find(p => p.id === id);
const task = id => S.tasks.find(t => t.id === id);
function ctx(t){ const p = projOf(t.pid) || {name:'?', bid:null}; const b = brandOf(p.bid) || {name:'?', color:'#999'}; return {p, b}; }
let lastAdded = null, focusAdd = false;

/* a task's status moves the project along automatically (you can still override it) */
function autoProject(pid){
  const p = projOf(pid); if (!p || p.status === 'hold') return;
  const ts = S.tasks.filter(t => t.pid === pid);
  if (ts.length && ts.every(t => t.status === 'done')) p.status = 'done';
  else if (p.status === 'done') p.status = 'doing';
  else if (p.status === 'todo' && ts.some(t => t.status !== 'todo')) p.status = 'doing';
}
function setStatus(t, s){ const was = t.done; t.status = s; t.done = s === 'done'; autoProject(t.pid); if (t.done && !was && !t.credited) { t.credited = true; creditPet(); } save(); }

const byDue = (a, b) => (a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : 0;
function stats(ts){
  const done = ts.filter(t => t.done).length, open = ts.filter(t => !t.done);
  const dues = open.filter(t => t.due).map(t => t.due).sort();
  return {total:ts.length, done, open:open.length, pct:ts.length ? Math.round(done/ts.length*100) : 0, next:dues[0] || '',
          overdue:open.filter(t => t.due && diff(t.due) < 0).length, blocked:open.filter(t => t.status === 'blocked').length};
}
const tasksOfBrand = b => { const ids = new Set(S.projects.filter(p => p.bid === b.id).map(p => p.id)); return S.tasks.filter(t => ids.has(t.pid)); };

/* ---------- cat + dial art ---------- */
const CAT_HEAD = 'M50 100C46 70 54 44 60 30L84 50C98 44 122 44 136 50L160 30C166 44 174 70 170 100C168 128 142 142 110 142C78 142 52 128 50 100Z';
function catSVG(sleep){
  return `<svg class="cat" viewBox="0 0 220 170" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="A cat peeking over the line">
  <g class="tail"><path d="M170 168C198 168 208 138 192 124C186 119 177 124 184 133"/></g>
  <path class="fillp" d="${CAT_HEAD}"/>
  <path d="M66 42L78 52M154 42L142 52" stroke-width="3"/>
  ${sleep
    ? `<path d="M76 98q8 7 16 0M128 98q8 7 16 0" stroke-width="3.5"/><text class="zz" x="170" y="36">z</text>`
    : `<g class="eyes"><circle cx="85" cy="97" r="4.8" fill="currentColor" stroke="none"/><circle cx="135" cy="97" r="4.8" fill="currentColor" stroke="none"/></g>`}
  <path d="M100 110q5 6 10 0q5 6 10 0" stroke-width="3"/>
  <g class="wh" stroke-width="2.6"><path d="M54 108L22 100M54 116L20 118M56 124L26 134"/><path d="M166 108L198 100M166 116L200 118M164 124L194 134"/></g>
  <path class="fillp" d="M72 168V140Q72 128 83 128Q94 128 94 140V168"/>
  <path class="fillp" d="M126 168V140Q126 128 137 128Q148 128 148 140V168"/>
  <path d="M83 146V156M137 146V156" stroke-width="3"/>
  <g stroke-width="3"><path d="M178 52l10-10M184 66l14-6M170 36l5-14"/></g>
</svg>`;

function renderStage(){
  const stage = $('#stage'); stage.hidden = S.tab !== 'brands'; if (stage.hidden) return;
  const it = items(), ai = Math.max(0, it.findIndex(x => x.id === S.brand));
  const mob = innerWidth < 760, R = mob ? 220 : 360, step = (mob ? 21 : 17) * Math.PI / 180, vis = mob ? 2 : 3;
  const keep = new Set(it.map(x => x.id)), box = $('#tiles');
  tileEls.forEach((el, id) => { if (!keep.has(id)) { el.remove(); tileEls.delete(id); } });
  it.forEach((x, i) => {
    let el = tileEls.get(x.id);
    if (!el) { el = document.createElement('button'); el.className = 'tile'; el.dataset.id = x.id; box.appendChild(el); tileEls.set(x.id, el); }
    const k = i - ai, a = k * step, on = k === 0, far = Math.abs(k) > vis;
    el.style.transform = `translate(-50%,0) translate(${(R*Math.sin(a)).toFixed(1)}px,${(R*(1-Math.cos(a)) - (on ? 22 : 0)).toFixed(1)}px) rotate(${on || !x.b ? 0 : a}rad) scale(${on ? 1.32 : 1})`;
    el.style.opacity = far ? 0 : 1; el.style.pointerEvents = far ? 'none' : 'auto'; el.style.zIndex = 10 - Math.abs(k);
    el.classList.toggle('on', on);
    if (x.b) {

      el.innerHTML = `<span class="em">${x.b.mark}</span>${open ? `<i class="cnt">${open}</i>` : ''}`;

/* in-page confirm dialog (native confirm() is blocked in sandboxed previews) */
let dlgDone = null;
function ask({title, body = '', list = null, ok = 'OK', cancel = 'Cancel', danger = false}){
  return new Promise(res => {
    if (dlgDone) dlgDone(false);
    const d = $('#dlg'), yes = $('#dlgYes'), no = $('#dlgNo');
    $('#dlgT').textContent = title;
    $('#dlgB').innerHTML = (body ? `<p>${esc(body)}</p>` : '') + (list ? `<ul>${list.map(x => `<li>${esc(x)}</li>`).join('')}</ul>` : '');
    yes.textContent = ok; no.textContent = cancel; yes.className = 'btn ' + (danger ? 'dng solid' : 'pri');
    d.hidden = false; (danger ? no : yes).focus();
    const key = e => {
      if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); done(false); }
      else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); done(document.activeElement !== no); }
      else if (e.key === 'Tab') { e.preventDefault(); (document.activeElement === yes ? no : yes).focus(); }
    };
    const done = v => { d.hidden = true; dlgDone = null; document.removeEventListener('keydown', key, true); yes.onclick = no.onclick = d.onclick = null; res(v); };
    document.addEventListener('keydown', key, true);
    yes.onclick = () => done(true); no.onclick = () => done(false); d.onclick = e => { if (e.target === d) done(false); };
    dlgDone = done;
  });
}

function openCal(anchor, value, cb){

  cal = {y:base.getFullYear(), m:base.getMonth(), value, cb, anchor, el:document.createElement('div')};
  cal.el.id = 'calpop'; cal.el.setAttribute('role', 'dialog'); cal.el.setAttribute('aria-label', 'Pick a date');
  document.body.appendChild(cal.el); drawCal();

  let left = Math.min(Math.max(8, r.left), innerWidth - w - 8), top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);

/* ---------- timer: start/stop per project, time log, manual time ---------- */
const clock = ms => `${pad(Math.floor(ms / 3600000))}:${pad(Math.floor(ms % 3600000 / 60000))}:${pad(Math.floor(ms % 60000 / 1000))}`;
const fmtDur = ms => { const t = Math.floor(ms / 1000), h = Math.floor(t / 3600), m = Math.floor(t % 3600 / 60); return h ? `${h}h ${pad(m)}m` : m ? `${m}m` : `${t}s`; };
const projMs = p => (p.sessions || []).reduce((a, x) => a + (x.e - x.s), 0) + (S.timer && S.timer.pid === p.id && liveFocus() ? Date.now() - S.timer.s : 0);
const liveFocus = () => S.timer && (!S.timer.pomo || S.timer.pomo.phase === 'focus');
const inFocus = () => !!liveFocus();
const mmss = ms => { ms = Math.max(0, ms); const m = Math.floor(ms / 60000); return `${pad(m)}:${pad(Math.floor(ms % 60000 / 1000))}`; };
const pomoLen = P => (P.phase === 'focus' ? P.f : P.phase === 'long' ? P.l : P.b) * 60000;
const POMO_PRESETS = [null, {f:25, b:5, l:15}, {f:50, b:10, l:30}, {f:15, b:3, l:10}];
function chime(){ try { const A = window.AudioContext || window.webkitAudioContext, c = new A(); [660, 880, 1100].forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.connect(g); g.connect(c.destination); const t = c.currentTime + i * .16; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.18, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .15); o.start(t); o.stop(t + .16); }); setTimeout(() => c.close(), 900); } catch(e){} }
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
function startTimer(pid){
  const was = S.timer && projOf(S.timer.pid); if (S.timer) stopTimer(true);
  const now = Date.now(); S.timer = {pid, s:now}; if (S.pomoSet.on) S.timer.pomo = {phase:'focus', ps:now, n:0, f:S.pomoSet.f, b:S.pomoSet.b, l:S.pomoSet.l, every:S.pomoSet.every};
  save(); render(); tickTimer();
  toast(S.timer.pomo ? `🍅 Pomodoro started — ${S.timer.pomo.f} min focus on ${q(projOf(pid).name)}` : was && was.id !== pid ? `Switched timer → ${q(projOf(pid).name)}` : `Timer started — ${q(projOf(pid).name)}`);
  petReact('timer');
}
function stopTimer(silent){
  if (!S.timer) return; const {pid, s: st} = S.timer, e = Date.now(), p = projOf(pid), wasFocus = !!liveFocus(), pomo = !!S.timer.pomo; S.timer = null;
  if (p && wasFocus && e - st >= 1000) { (p.sessions = p.sessions || []).push(pomo ? {s:st, e, pomo:true} : {s:st, e}); if (!silent) { toast(`Logged ${fmtDur(e - st)} on ${q(p.name)}`); petReact('timerStop', fmtDur(e - st)); } }
  else if (!silent) petReact('timerStop');
  save(); render(); tickTimer();
}
function pomoStep(t, endAt){
  const P = t.pomo;
  if (P.phase === 'focus') { const p = projOf(t.pid); if (p && endAt - t.s >= 1000) (p.sessions = p.sessions || []).push({s:t.s, e:endAt, pomo:true}); P.n++; P.phase = P.n % (P.every || 4) === 0 ? 'long' : 'break'; P.ps = endAt; }
  else { P.phase = 'focus'; P.ps = endAt; t.s = endAt; }
}
function pomoAnnounce(){
  const P = S.timer.pomo, p = projOf(S.timer.pid); chime();
  if (P.phase === 'focus') { notify(`🍅 Focus time — ${P.f} minutes on ${q(p.name)}`); petReact('timer'); }
  else { notify(P.phase === 'long' ? `🌴 Long break — ${P.l} minutes. ${P.n} pomodoros done!` : `☕ Break time — ${P.b} minutes. Nice focus!`); petReact('break'); }
}
function pomoSkip(){ const t = S.timer; if (!t || !t.pomo) return; pomoStep(t, Date.now()); save(); render(); tickTimer(); pomoAnnounce(); }
function tickTimer(){
  const pill = $('#timerPill'), t = S.timer, p = t && projOf(t.pid);
  pill.hidden = !p;
  if (!p) { document.title = 'Purrgress · Plan · Focus · Achieve'; return; }
  const P = t.pomo; let changed = false;
  if (P) { for (let g = 0; g < 12 && Date.now() >= P.ps + pomoLen(P); g++) { pomoStep(t, P.ps + pomoLen(P)); changed = true; } if (changed) { save(); render(); pomoAnnounce(); } }
  const ms = Date.now() - t.s, brk = P && P.phase !== 'focus';
  $('#timerPill').classList.toggle('brk', !!brk); $('#tpSkip').hidden = !P;
  $('#tpTime').textContent = P ? mmss(pomoLen(P) - (Date.now() - P.ps)) : clock(ms);
  $('#tpPhase').textContent = P ? (P.phase === 'focus' ? `🍅 ${P.n % (P.every || 4) + 1}/${P.every || 4}` : P.phase === 'long' ? '🌴 long break' : '☕ break') : '';
  $('#tpName').textContent = p.name;
  document.title = P ? `${brk ? '☕' : '🍅'} ${mmss(pomoLen(P) - (Date.now() - P.ps))} · ${p.name}` : `⏱ ${clock(ms)} · ${p.name}`;
  document.querySelectorAll('.ttime').forEach(el => { const pp = projOf(el.dataset.pid); if (pp) el.textContent = 'clock' in el.dataset ? clock(projMs(pp)) : '⏱ ' + fmtDur(projMs(pp)); });
}
setInterval(tickTimer, 1000);
$('#tpStop').onclick = () => stopTimer(); $('#tpSkip').onclick = pomoSkip;
function tlogHTML(p){
  const ss = p.sessions || [], tot = projMs(p);
  return `<details class="tlog" data-pid="${p.id}" ${S.tlog === p.id ? 'open' : ''}><summary>Time log · ${ss.length} session${ss.length === 1 ? '' : 's'} · ${fmtDur(tot)} total</summary>
    ${ss.length ? [...ss.keys()].reverse().slice(0, 20).map(i => `<div class="ts" data-i="${i}"><span>${ss[i].pomo ? '🍅 ' : ''}${fmtLong(iso(new Date(ss[i].s)))} · ${hm(ss[i].s)}–${hm(ss[i].e)}</span><b>${fmtDur(ss[i].e - ss[i].s)}</b><button class="mx" data-a="tdel" aria-label="Delete time entry">×</button></div>`).join('') : '<div class="ts">No time logged yet. Press ▶ to start.</div>'}
    <div class="tman" data-pid="${p.id}"><input placeholder="Add time manually — e.g. 45m or 1h30" autocomplete="off" aria-label="Add time manually"><button class="btn" data-a="tadd">+ Add</button></div></details>`;
}
function parseDur(v){
  v = v.toLowerCase().trim(); if (!v) return 0;
  let m;
  if ((m = v.match(/^(\d+(?:\.\d+)?)\s*h(?:ours?|rs?)?\s*(?:(\d+)\s*m?(?:in)?)?$/))) return Math.round(+m[1] * 3600000 + (m[2] ? +m[2] * 60000 : 0));
  if ((m = v.match(/^(\d+)\s*m(?:in(?:ute)?s?)?$/)) || (m = v.match(/^(\d+)$/))) return +m[1] * 60000;
  if ((m = v.match(/^(\d+):(\d{2})$/))) return +m[1] * 3600000 + +m[2] * 60000;
  return 0;
}

/* ---------- music (YouTube player; only contacts YouTube once you press play) ---------- */
let yt = null, ytReady = false, ytPending = null, ytP = false, ytLoading = null;
function loadYT(){
  if (window.YT && YT.Player) return Promise.resolve();
  if (ytLoading) return ytLoading;
  ytLoading = new Promise((res, rej) => {
    window.onYouTubeIframeAPIReady = res;
    const sc = document.createElement('script'); sc.src = 'https://www.youtube.com/iframe_api';
    sc.onerror = () => { ytLoading = null; rej(); }; document.head.appendChild(sc);
    setTimeout(() => { if (!(window.YT && YT.Player)) { ytLoading = null; rej(); } }, 12000);
  });
  return ytLoading;
}
function parseYT(u){
  try {
    const url = new URL(u.trim().includes('://') ? u.trim() : 'https://' + u.trim()), h = url.hostname.replace(/^(www|m|music)\./, '');
    if (h !== 'youtube.com' && h !== 'youtu.be') return null;
    let v = url.searchParams.get('v'); const list = url.searchParams.get('list');
    if (h === 'youtu.be') v = url.pathname.slice(1).split('/')[0];
    const m = url.pathname.match(/^\/(?:shorts|embed|live)\/([\w-]{11})/); if (m) v = m[1];
    if (v && /^[\w-]{11}$/.test(v)) return {vid:v, list:''};

  } catch(e){}
  return null;
}

/* solo behaviour: stroll along the bottom of the screen, sometimes wander up into the page, nap at night or when you're away */

    const u = CATS[0]; await walkTo(c, u.x + (u.dir > 0 ? -58 : 58), u.y); setPose(c, 'sleep'); return 12000;

  if (r < .5) { await walkTo(c, b.x0 + Math.random() * (b.x1 - b.x0), b.y1); setPose(c, 'sit'); return 2500 + Math.random() * 3000; }

  setPose(a, 'happy'); setPose(f, 'happy'); heartsAt(mx + 6, groundY(a) - 6, 5); catSpeak(a, 'boop! 💕'); catSpeak(f, '*nose boop*'); await delay(2200);
}

  }

}

  setPose(a, 'sit'); setPose(f, 'groom'); catSpeak(f, '*lick lick*'); heartsAt(mx + 10, groundY(a) - 4, 3); await delay(2600);
}

  const [a, f] = CATS, mx = evMid(), gap = catW(a) * 1.1;
  await Promise.all([walkTo(a, mx - gap, groundY(a), 85), walkTo(f, mx + gap * .3, groundY(f), 85)]); if (!alive(tok)) return;

/* ---------- interaction: pick cats up, rub them, eyes follow you, toys ---------- */
let lastPtr = {x:innerWidth / 2, y:innerHeight / 2}, eyeRaf = 0;
function enableDrag(c){
  let st = null;
  c.btn.addEventListener('pointerdown', e => { if (e.button) return; st = {x:e.clientX, y:e.clientY, moved:false}; try { c.btn.setPointerCapture(e.pointerId); } catch(_){} });
  c.btn.addEventListener('pointermove', e => {
    if (!st) return;
    if (!st.moved && Math.hypot(e.clientX - st.x, e.clientY - st.y) > 8) { st.moved = true; c.held = true; c.busy = true; petEvt++; c.el.classList.remove('walk', 'run', 'fall'); setPose(c, 'held'); catSpeak(c, pick(['whoa!', 'put me down!', 'eep!']), 1800); }
    if (st.moved) { c.x = clampN(e.clientX - catW(c) / 2, 0, innerWidth - catW(c)); c.y = clampN(e.clientY - 10, 0, innerHeight - catH(c)); c.el.style.transform = `translate(${c.x}px,${c.y}px)`; c.btn.style.pointerEvents = 'auto'; }
  });
  const end = e => { if (!st) return; const was = st.moved; st = null; try { c.btn.releasePointerCapture(e.pointerId); } catch(_){} if (was) { c.suppressClick = true; setTimeout(() => c.suppressClick = false, 0); dropCat(c); } };
  c.btn.addEventListener('pointerup', end); c.btn.addEventListener('pointercancel', end);
}
async function dropCat(c){
  const gy = bounds(c).y1, d = Math.max(0, gy - c.y);
  c.held = false; setPose(c, 'fall');
  if (d > 4) { const dur = .25 + Math.sqrt(d) / 38; c.el.style.setProperty('--dur', dur + 's'); c.y = gy; c.el.style.transform = `translate(${c.x}px,${c.y}px)`; await delay(dur * 1000); }
  c.btn.style.pointerEvents = 'auto'; setPose(c, 'happy'); heartsOn(c, 2); catSpeak(c, pick(['nailed it!', '*thud* …I meant to do that', 'whee! again?']));
  const o = CATS.find(x => x !== c && catShown(x));
  if (o && !o.held && Math.hypot(o.x - c.x, o.y - c.y) < catW(c) * 1.3) { setPose(o, 'happy'); heartsAt((o.x + c.x) / 2 + catW(c) / 2, c.y, 3); catSpeak(o, 'hi friend! 💕'); setTimeout(() => backToSit(o), 1600); }
  setTimeout(() => { if (!c.held) { c.busy = false; backToSit(c); } }, 1700);
}
function updateEyes(){
  eyeRaf = 0;
  CATS.forEach(c => { if (!catShown(c) || c.pose === 'sleep') return; const r = c.btn.getBoundingClientRect(), cx = r.left + r.width * (c.dir > 0 ? .7 : .3), cy = r.top + r.height * .4, dx = lastPtr.x - cx, dy = lastPtr.y - cy, m = Math.hypot(dx, dy) || 1, k = Math.min(m / 160, 1);
    c.el.style.setProperty('--ex', (dx / m * k * 2.2 * c.dir).toFixed(1) + 'px'); c.el.style.setProperty('--ey', (dy / m * k * 2).toFixed(1) + 'px'); });
}
addEventListener('pointermove', e => {
  lastPtr = {x:e.clientX, y:e.clientY}; if (laserEl) { laserEl.style.left = e.clientX + 'px'; laserEl.style.top = e.clientY + 'px'; }
  if (!eyeRaf) eyeRaf = requestAnimationFrame(updateEyes);
  if (e.buttons) return;
  CATS.forEach(c => { // rubbing a cat makes it purr
    if (!catShown(c) || c.held || c.busy) return; const r = c.btn.getBoundingClientRect();
    if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) { c.rub = 0; return; }
    c.rub = (c.rub || 0) + Math.hypot(e.movementX || 0, e.movementY || 0);
    if (c.rub > 240 && Date.now() - (c.lastPurr || 0) > 2200) { c.rub = 0; c.lastPurr = Date.now(); if (!c.friend) { S.pet.love = Math.min(100, S.pet.love + 1); save(); } setPose(c, 'happy'); heartsOn(c, 1); catSpeak(c, pick(['prrrr…', '*purr purr*', 'mmm yes, there']), 1800); setTimeout(() => backToSit(c), 1400); }
  });
}, {passive:true});

const YARN = '<svg viewBox="0 0 30 30" fill="none" stroke="#2B2019" stroke-width="1.6" stroke-linecap="round"><circle cx="15" cy="15" r="12" fill="var(--yellow)"/><path d="M5 11q10 6 20 0M4 17q11 7 22 0M9 5q8 12 0 20"/><path d="M26 20q4 3 1 7" stroke="var(--red)"/></svg>';
let tool = null, toolT = 0, laserEl = null, laserT = 0;
function setTool(t){
  if (tool === 'laser' && t !== 'laser') endLaser();
  tool = t; clearTimeout(toolT);
  if (t) document.body.dataset.tool = t; else delete document.body.dataset.tool;
  if (t === 'laser') startLaser();
  else if (t) { catSpeak(CATS[0], t === 'yarn' ? 'click anywhere to throw the yarn 🧶' : 'click where the treat should land 🐟', 5000); toolT = setTimeout(() => setTool(null), 20000); }
}
document.addEventListener('click', e => {
  if (!tool) return;
  if (e.target.closest('#petCard, #dlg')) return;
  e.preventDefault(); e.stopPropagation();
  if (tool === 'laser') return endLaser();
  const k = tool; setTool(null); dropToy(k, e.clientX, e.clientY);
}, true);
function moveTo(c, x, y, speed){ // like walkTo but does not wait (used for chasing a moving target)
  if (c.held) return; const b = bounds(c); x = clampN(x, b.x0, b.x1); y = clampN(y, b.y0, b.y1);
  const dx = x - c.x, dist = Math.hypot(dx, y - c.y); if (dist < 3) return;
  if (Math.abs(dx) > 6) { c.dir = dx > 0 ? 1 : -1; c.btn.style.setProperty('--dir', c.dir); }
  c.el.style.setProperty('--dur', Math.max(.15, dist / speed) + 's'); if (c.pose !== 'run') setPose(c, 'run');
  c.x = x; c.y = y; c.el.style.transform = `translate(${x}px,${y}px)`; c.btn.style.pointerEvents = groundish(c) ? 'auto' : 'none';
}
function startLaser(){
  const cats = CATS.filter(catShown); if (!cats.length) { tool = null; delete document.body.dataset.tool; return; }
  laserEl = document.createElement('div'); laserEl.id = 'laser'; laserEl.style.left = lastPtr.x + 'px'; laserEl.style.top = lastPtr.y + 'px'; document.body.appendChild(laserEl);
  petEvt++; cats.forEach(c => { c.busy = true; }); catSpeak(cats[0], 'ooh, a red dot!', 3000);
  const t0 = Date.now();
  laserT = setInterval(() => {
    if (Date.now() - t0 > 12000) return setTool(null);
    cats.forEach((c, i) => { const tx = lastPtr.x - catW(c) / 2 + (i ? 46 : -30), ty = lastPtr.y - catH(c) * .7;
      if (Math.hypot(tx - c.x, ty - c.y) > 60) moveTo(c, tx, ty, 200); else if (c.pose !== 'play' && !c.held) setPose(c, 'play'); });
  }, 220);
}
function endLaser(){
  clearInterval(laserT); laserEl && laserEl.remove(); laserEl = null; tool = null; delete document.body.dataset.tool;
  const cats = CATS.filter(catShown); S.pet.love = Math.min(100, S.pet.love + 5); save();
  cats.forEach(c => { c.busy = false; setPose(c, 'happy'); heartsOn(c, 2); setTimeout(() => backToSit(c), 1800); }); if (cats[0]) catSpeak(cats[0], 'got it!! 😼');
}
async function dropToy(kind, x, y){
  const cats = CATS.filter(c => catShown(c) && !c.held); if (!cats.length) return;
  if (kind === 'treat') { if (S.pet.treats < 1) return toast('No treats left — finish a task to earn one 🐟'); S.pet.treats--; save(); }
  petEvt++; cats.forEach(c => { c.busy = true; });
  const el = document.createElement('div'); el.className = 'toy ' + kind; el.innerHTML = kind === 'treat' ? '🐟' : YARN;
  el.style.left = x - 14 + 'px'; el.style.top = y - 14 + 'px'; document.body.appendChild(el);
  await delay(30); el.style.top = innerHeight - 34 + 'px'; await delay(600); // it falls to the floor
  let ix = x;
  const go = async (c, speed) => { const dir = c.x + catW(c) / 2 < ix ? 1 : -1, tx = dir === 1 ? ix - catW(c) * .85 : ix - catW(c) * .15; await walkTo(c, tx, bounds(c).y1, speed); c.dir = dir; };
  try {
    const order = [...cats].sort((a, b) => Math.abs(a.x - ix) - Math.abs(b.x - ix));
    if (kind === 'treat') {
      const [first, ...rest] = order; rest.forEach(o => { catSpeak(o, 'hey, share! 🥺'); go(o, 70); });
      await go(first, 120); el.remove(); setPose(first, 'eat'); heartsOn(first, 3); catSpeak(first, pick(['nom nom nom', 'yum! 🐟', '*crunch*']));
      S.pet.love = Math.min(100, S.pet.love + 8); save(); await delay(3600);
    } else {
      await Promise.all(order.map(c => go(c, 130))); order.forEach(c => setPose(c, 'play')); catSpeak(order[0], pick(['got it!', 'pounce!', '*bat bat*'])); await delay(2800);
      ix = clampN(ix + (ix > innerWidth / 2 ? -150 : 150), 40, innerWidth - 60); el.classList.add('roll'); el.style.left = ix - 14 + 'px'; await delay(150);
      await Promise.all(order.map(c => go(c, 150))); order.forEach(c => setPose(c, 'play')); heartsOn(order[0], 3); await delay(2600);
      S.pet.love = Math.min(100, S.pet.love + 6); save();
    }
  } finally {
    el.remove(); cats.forEach(c => { if (!c.held) { c.busy = false; setPose(c, 'sit'); } });
  }
}

/* on / off */
function applyPet(entrance){
  const on = S.pet.on, f = CATS[1];
  petEvt++; clearTimeout(petEvtT);
  if (tool) setTool(null);
  CATS.forEach(c => { c.busy = false; c.held = false; clearTimeout(c.loop); c.el.hidden = !catShown(c); });
  $('#petToggle').classList.toggle('on', on); $('#petToggle').title = on ? 'Hide your cat' : 'Show your cat';
  $('#petToggle2').textContent = on ? '🐾 Hide cat' : '🐾 Show cat';
  if (!on) return;
  CATS.forEach(c => {
    if (!catShown(c)) return; const b = bounds(c);
    if (!c.placed) { place(c, c.friend ? b.x1 * .72 : b.x1 * .2, b.y1); c.placed = true; }
    else place(c, c.x, c.y);
    setPose(c, inFocus() && !c.friend ? 'focus' : 'sit'); c.loop = setTimeout(() => tickCat(c), 1500 + Math.random() * 2500);
  });
  if (entrance && catShown(f)) { const t = f.x; f.el.hidden = false; face(f, -1); place(f, innerWidth + 30, bounds(f).y1); f.el.style.transform = `translate(${f.x}px,${f.y}px)`; setTimeout(() => { f.busy = true; walkTo(f, t, bounds(f).y1, 60).then(() => { f.busy = false; setPose(f, 'sit'); catSpeak(f, 'hi! I’m ' + S.pet.friend.name + ' 🧡'); }); }, 60); }
  if (S.pet.friend.on) petEvtT = setTimeout(runEvent, 9000);
}
function setPetOn(on){
  S.pet.on = on; save(); applyPet(); closePetCard();
  if (on) { notify(S.pet.name ? `${S.pet.name} is back! 🐾` : 'Your cat has moved in 🐾'); setTimeout(() => petSay(S.pet.name ? `hi, it’s ${S.pet.name} 😺` : 'hi! give me a name? 😺'), 500); }
  else notify(`${petName()} went off to nap. Tap 🐾 to bring them back.`);
}
function setFriendOn(on){
  S.pet.friend.on = on; save(); const keep = !$('#petCard').hidden; applyPet(on); if (keep) renderPetCard();
  notify(on ? `${S.pet.friend.name} has come to visit! 🧡` : `${S.pet.friend.name} went home.`);
}
$('#petToggle').onclick = $('#petToggle2').onclick = () => setPetOn(!S.pet.on);
['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, () => { petIdleAt = Date.now(); CATS.forEach(c => { if (c.pose === 'sleep' && catShown(c) && !c.busy && !nightIdle()) setPose(c, 'sit'); }); }, {passive:true}));
addEventListener('resize', () => CATS.forEach(c => { if (c.placed) place(c, c.x, c.y); }));
mkCat(false); mkCat(true); applyPet();
if (S.pet.on && S.pet.friend.on && !S.pet.friend.seen) setTimeout(() => { S.pet.friend.seen = true; save(); catSpeak(CATS[1], `hi! I’m ${S.pet.friend.name} 🧡`, 4500); }, 1500);
if (S.pet.on && !S.pet.name && !S.pet.asked) setTimeout(() => { if (S.pet.on && !S.pet.name) { S.pet.asked = true; save(); openPetCard('pet'); petSay('hi! what should you call me? 😺', 6000); } }, 1800);

/* ---------- cross-device sync (Vercel /api/state → Upstash Redis) ---------- */
const SYNC_KEYS = ['brands', 'projects', 'tasks', 'music', 'pet', 'timer', 'pomoSet'];
const syncPayload = () => { const o = {}; SYNC_KEYS.forEach(k => o[k] = S[k]); return JSON.parse(JSON.stringify(o)); };
async function syncApi(method, body, meta){
  const r = await fetch('/api/state' + (meta ? '?meta=1' : ''), {method, cache:'no-store', headers:{'x-passcode':SYNC.pass, ...(body ? {'Content-Type':'application/json'} : {})}, body:body ? JSON.stringify(body) : undefined});
  let data = null; try { data = await r.json(); } catch(e){}
  return {status:r.status, data};
}
function setSyncStatus(st, msg = ''){
  SYNC.status = st; SYNC.msg = msg;
  const label = {off:'☁', ok:'☁', syncing:'⟳', pending:'⟳', offline:'⚠', error:'⚠', conflict:'⚠'}[st] || '☁';
  const cls = st === 'ok' ? 'ok' : (st === 'error' || st === 'conflict' || st === 'offline') ? 'bad' : (st === 'syncing' || st === 'pending') ? 'busy' : '';
  const b = $('#syncBtn'); b.textContent = label; b.className = cls;
  $('#syncBtn2').textContent = `${label} Sync${st === 'ok' ? 'ed' : ''}`;
  if (!$('#sync').hidden) renderSync();
}
let syncPushT = 0;
function onSaved(){
  if (!SYNC.pass) return;
  if (SYNC.hash && JSON.stringify(syncPayload()) === SYNC.hash) return; // only real data changes sync (not which tab you're on)
  SYNC.dirty = true; saveSync();
  if (SYNC.conflict) return;
  clearTimeout(syncPushT); syncPushT = setTimeout(() => syncPush(), 1500); setSyncStatus('pending');
}
async function syncPush(force){
  if (!SYNC.pass) return; setSyncStatus('syncing');
  try {
    const r = await syncApi('PUT', {state:syncPayload(), baseAt:SYNC.at, force:!!force});
    if (r.status === 200) { SYNC.at = r.data.updatedAt; SYNC.dirty = false; SYNC.hash = JSON.stringify(syncPayload()); saveSync(); setSyncStatus('ok'); SYNC.lastAt = Date.now(); }
    else if (r.status === 409) { SYNC.conflict = {remote:r.data, kind:'diverged'}; setSyncStatus('conflict'); openSync(true); }
    else if (r.status === 401) setSyncStatus('error', 'Wrong passcode');
    else if (r.status === 413) setSyncStatus('error', 'Your data is too large to sync (limit ≈ 900 KB)');
    else setSyncStatus('error', `Server error (${r.status})`);
  } catch(e){ setSyncStatus('offline', 'Offline — will retry'); }
}
function fixupRemote(){
  S.tasks = S.tasks || []; S.projects = S.projects || []; S.brands = S.brands || [];
  S.tasks.forEach(t => { t.comments = t.comments || []; t.created = t.created || Date.now(); t.status = t.status || (t.done ? 'done' : 'todo'); t.done = t.status === 'done'; });
  S.projects.forEach(p => { p.due = p.due || ''; p.sessions = p.sessions || []; p.status = p.status || 'todo'; });
  S.music = S.music || {tracks:[], idx:0};
  S.pet = Object.assign({on:true, name:'', love:30, treats:0, done:0, seeded:true, asked:true}, S.pet || {});
  S.pet.friend = Object.assign({on:true, name:'Pudding', seen:true}, S.pet.friend || {});
  S.pet.look = Object.assign({fur:'auto', pattern:'plain', acc:'none'}, S.pet.look || {});
  S.pet.friend.look = Object.assign({fur:'#E8914F', pattern:'stripes', acc:'none'}, S.pet.friend.look || {});
  S.pomoSet = Object.assign({on:false, f:25, b:5, l:15, every:4}, S.pomoSet || {});
  if (S.timer && !projOf(S.timer.pid)) S.timer = null;
  if (S.brand !== '+' && !S.brands.some(b => b.id === S.brand)) S.brand = S.brands[0]?.id || '+';
  if (S.open && !projOf(S.open)) S.open = null;
}
function applyRemote(doc){
  SYNC.applying = true;
  const keep = {tab:S.tab, brand:S.brand, open:S.open, cal:S.cal, tlog:S.tlog, theme:S.theme};
  S = {...keep, ...doc.state}; S.adding = false; S.edit = null; fixupRemote(); save();
  SYNC.applying = false; SYNC.at = doc.updatedAt; SYNC.dirty = false; SYNC.hash = JSON.stringify(syncPayload()); saveSync();
  if (openId && !task(openId)) closeDrawer();
  render(); applyPet(); tickTimer(); setSyncStatus('ok'); SYNC.lastAt = Date.now();
}
async function syncPull(initial){
  if (!SYNC.pass || SYNC.conflict) return;
  try {
    const m = await syncApi('GET', null, true);
    if (m.status === 401) return setSyncStatus('error', 'Wrong passcode');
    if (m.status === 501) return setSyncStatus('error', 'The server isn’t set up for sync yet. Missing: ' + ((m.data && m.data.missing) || ['PURRGRESS_PASSCODE', 'Upstash Redis']).join(', ') + '. Add it in Vercel and redeploy (see README).');
    if (m.status === 404 || m.status === 405) return setSyncStatus('error', 'No sync server here — open your deployed Vercel site');
    if (m.status !== 200 || !m.data) return setSyncStatus('error', `Server error (${m.status})`);
    const at = m.data.updatedAt || 0;
    if (at === 0) { if (S.tasks.length || S.brands.length) return syncPush(); return setSyncStatus('ok'); }
    if (at === SYNC.at) { if (SYNC.dirty) return syncPush(); SYNC.hash = JSON.stringify(syncPayload()); SYNC.lastAt = Date.now(); return setSyncStatus('ok'); }
    const full = await syncApi('GET');
    if (full.status !== 200) return setSyncStatus('error', `Server error (${full.status})`);
    if (initial && !SYNC.at) { SYNC.conflict = {remote:full.data, kind:'first'}; setSyncStatus('conflict'); return openSync(true); }
    if (SYNC.dirty) { SYNC.conflict = {remote:full.data, kind:'diverged'}; setSyncStatus('conflict'); return openSync(true); }
    applyRemote(full.data); notify('Updated from your other device ☁️');
  } catch(e){ setSyncStatus('offline', 'Offline — will retry'); }
}
function renderSync(){
  const el = $('#sync'), st = SYNC.status, t = SYNC.lastAt ? new Date(SYNC.lastAt) : null;
  if (!SYNC.pass) el.innerHTML = `<button class="x" id="syClose" aria-label="Close">✕</button><h4>Sync across devices</h4>
    <p>Keep the same brands, tasks, timers and cats on your phone and laptop. Enter the passcode you set on your server.</p>
    <input id="syIn" type="password" placeholder="Passcode" autocomplete="off" aria-label="Passcode">
    ${SYNC.msg ? `<div class="msg">${esc(SYNC.msg)}</div>` : ''}
    <div class="row"><button class="cta" id="syConnect" type="button">Connect</button></div>`;
  else if (SYNC.conflict) el.innerHTML = `<button class="x" id="syClose" aria-label="Close">✕</button><h4>${SYNC.conflict.kind === 'first' ? 'The cloud already has data' : 'Your devices disagree'}</h4>
    <p>${SYNC.conflict.kind === 'first' ? 'Another device already saved data. A new device should usually use the cloud version.' : 'This device and the cloud both changed since the last sync. Pick the one to keep — the other is replaced.'}</p>
    <div class="row"><button class="cta" id="syCloud" type="button">Use cloud data</button><button class="btn" id="syDevice" type="button">Use this device</button></div>`;
  else el.innerHTML = `<button class="x" id="syClose" aria-label="Close">✕</button><h4>${st === 'ok' ? 'Synced ✓' : st === 'offline' ? 'Offline' : st === 'error' ? 'Sync problem' : 'Syncing…'}</h4>
    <p>${st === 'ok' && t ? `Last sync ${pad(t.getHours())}:${pad(t.getMinutes())}. Changes upload a moment after you make them and arrive on your other devices when you open or return to the page.` : esc(SYNC.msg || 'Working…')}</p>
    ${st === 'error' && SYNC.msg ? `<div class="msg">${esc(SYNC.msg)}</div>` : ''}
    <div class="row"><button class="cta" id="syNow" type="button">Sync now</button><button class="btn dng" id="syOff" type="button">Disconnect this device</button></div>`;
}
function openSync(show = $('#sync').hidden){ const el = $('#sync'); el.hidden = !show; if (show) { renderSync(); $('#syIn')?.focus(); } }
async function syncConnect(){
  const v = $('#syIn').value; if (!v) return $('#syIn').focus();
  SYNC.pass = v; SYNC.at = 0; SYNC.dirty = false; SYNC.conflict = null; setSyncStatus('syncing');
  await syncPull(true);
  if (SYNC.status === 'error' || SYNC.status === 'offline') { const msg = SYNC.msg; SYNC.pass = ''; saveSync(); setSyncStatus('off', msg); return; }
  saveSync();
  if (SYNC.status === 'ok') notify('Cloud sync is on ☁️ — this device is connected');
  renderSync();
}
$('#sync').addEventListener('click', async e => {
  const id = e.target.closest('button')?.id; if (!id) return;
  if (id === 'syClose') openSync(false);
  if (id === 'syConnect') syncConnect();
  if (id === 'syNow') { clearTimeout(syncPushT); if (SYNC.dirty) await syncPush(); else await syncPull(); }
  if (id === 'syCloud') { const c = SYNC.conflict; SYNC.conflict = null; applyRemote(c.remote); notify('Using the cloud version ☁️'); saveSync(); renderSync(); }
  if (id === 'syDevice') { SYNC.conflict = null; SYNC.dirty = true; await syncPush(true); if (SYNC.status === 'ok') notify('This device’s data replaced the cloud copy'); }
  if (id === 'syOff') { if (!await ask({title:'Disconnect this device?', body:'Your data stays here and in the cloud. This device just stops syncing.', ok:'Yes, disconnect', danger:true})) return; SYNC.pass = ''; SYNC.at = 0; SYNC.dirty = false; SYNC.conflict = null; saveSync(); setSyncStatus('off'); renderSync(); }
});
$('#sync').addEventListener('keydown', e => { if (e.target.id === 'syIn' && e.key === 'Enter') { e.preventDefault(); syncConnect(); } if (e.key === 'Escape') { e.stopPropagation(); openSync(false); } });
$('#syncBtn').onclick = $('#syncBtn2').onclick = () => openSync();
setInterval(() => { if (SYNC.pass && !document.hidden) syncPull(); }, 45000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncPull(); });
addEventListener('online', () => { if (SYNC.dirty) syncPush(); else syncPull(); });
addEventListener('focus', () => syncPull());
setSyncStatus(SYNC.pass ? 'syncing' : 'off');
if (SYNC.pass) syncPull();

/* ---------- theme (dark brown / cream, from the brand kit) ---------- */
function pattern(stroke){
  const c = stroke === 'dark' ? '%23F2EAD9' : '%232B2019', cat = `<path d='M0 8C-1 0 2-6 5-9L10-4C13-5 17-5 20-4L25-9C28-6 31 0 30 8C29 16 21 20 15 20C9 20 1 16 0 8Z'/><circle cx='9' cy='9' r='1.2' fill='${c}'/><circle cx='21' cy='9' r='1.2' fill='${c}'/>`;
  const spark = (x, y, k) => `<path transform='translate(${x} ${y}) scale(${k})' d='M0-8L2-2L8 0L2 2L0 8L-2 2L-8 0L-2-2Z' fill='${c}' stroke='none'/>`;
  return `url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240' fill='none' stroke='${c}' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><g transform='translate(34 44)'>${cat}</g><g transform='translate(150 128) rotate(-12)'>${cat}</g><g transform='translate(62 178) scale(.8)'>${cat}</g>${spark(120, 40, 1)}${spark(205, 52, .7)}${spark(30, 120, .8)}${spark(200, 205, 1)}${spark(112, 140, .6)}</svg>")`;
}
function applyTheme(){
  const t = S.theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = t;
  document.documentElement.style.setProperty('--pattern', pattern(t));
  $('#themeBtn').textContent = t === 'dark' ? '☀' : '☾'; $('#themeBtn').title = t === 'dark' ? 'Switch to light' : 'Switch to dark';
  $('#themeBtn2').textContent = t === 'dark' ? '☀ Light mode' : '☾ Dark mode';
}
$('#themeBtn').onclick = $('#themeBtn2').onclick = () => { S.theme = S.theme === 'light' ? 'dark' : 'light'; save(); applyTheme(); };
$('#logo').innerHTML = logoSVG;
applyTheme();
render(); tickTimer();
</script>
</body>
