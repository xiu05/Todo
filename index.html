<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Purrgress · brand tracker</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#efe5d3; --paper2:#f6eee0; --card:#fbf7ee; --soft:#f1e7d6; --ink:#3a2418; --muted:#9b8573;
  --line:rgba(58,36,24,.16); --accent:#c4472f; --yellow:#f2c53d; --grain:.5;
  --shadow:0 1px 2px rgba(58,36,24,.06),0 24px 60px -20px rgba(58,36,24,.28);
  --disp:'Bricolage Grotesque','Helvetica Neue',Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root{--paper:#1b1512; --paper2:#211a16; --card:#2a221c; --soft:#332a23; --ink:#f3e9d9; --muted:#9d8c7b;
        --line:rgba(243,233,217,.16); --accent:#ef7b5d; --yellow:#e8b92e; --grain:.12;
        --shadow:0 1px 2px rgba(0,0,0,.4),0 24px 60px -20px rgba(0,0,0,.7);}
}
*{box-sizing:border-box}
html,body{margin:0}
html{background:var(--paper);overflow-x:hidden}
body{background:linear-gradient(180deg,var(--paper2),var(--paper) 55%);background-attachment:fixed;color:var(--ink);
  font:16px/1.45 var(--disp);-webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:var(--grain);mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .12 0 0 0 .55 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
@media (prefers-color-scheme:dark){body::before{mix-blend-mode:screen}}
.wrap{max-width:1080px;margin:0 auto;padding:18px 18px 120px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font:500 12px/1.2 var(--mono);letter-spacing:.05em;text-transform:uppercase}

/* status colours */
.s-todo{--sc:var(--muted)} .s-doing{--sc:#d9962f} .s-review{--sc:#8a6fc9} .s-blocked{--sc:var(--accent)} .s-done{--sc:#5f9d6e} .s-hold{--sc:#a08a6a}

/* ---------- nav ---------- */
.nav{display:flex;align-items:center;gap:18px;margin-bottom:6px}
#logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-size:19px;background:var(--card);
  transition:transform .2s cubic-bezier(.3,1.6,.5,1)}
#logo:hover{transform:rotate(-12deg) scale(1.08)} #logo:active{transform:scale(.88)}
.word{font:800 20px var(--disp);letter-spacing:-.03em;font-stretch:80%}
.tabs{margin-left:auto;display:flex;gap:4px}
.tabs button{font:500 12px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 13px;border-radius:99px;border:1.5px solid transparent;color:var(--muted);transition:.15s}
.tabs button:hover{color:var(--ink)}
.tabs button.on{border-color:var(--ink);color:var(--ink)}
#clock{color:var(--muted)}
#saved{opacity:0;transition:opacity .3s;color:#5f9d6e;white-space:nowrap}
#saved.ok{opacity:1} #saved.bad{opacity:1;color:var(--accent)}
#bubble{position:fixed;top:66px;right:18px;z-index:70;background:var(--ink);color:var(--paper);font:500 12px var(--mono);letter-spacing:.04em;
  padding:9px 14px;border-radius:14px 14px 3px 14px;opacity:0;transform:translateY(6px);transition:.25s;pointer-events:none}
#bubble.on{opacity:1;transform:none}

/* ---------- stage: arc of brands ---------- */
#stage{position:relative;height:284px;margin-bottom:-6px;overflow-x:clip}
#arcLabel{position:absolute;left:50%;top:6px;transform:translateX(-50%);background:var(--card);border:1.5px solid var(--ink);border-radius:10px;
  padding:6px 14px;font:600 14px var(--disp);box-shadow:0 8px 20px -10px rgba(58,36,24,.4);white-space:nowrap;z-index:20;max-width:80vw;overflow:hidden;text-overflow:ellipsis}
#tiles{position:absolute;left:50%;top:84px;width:0;height:0}
.tile{position:absolute;left:0;top:0;width:74px;height:74px;border-radius:22px;background:var(--t,var(--soft));display:grid;place-items:center;
  font-size:36px;transition:transform .55s cubic-bezier(.25,1,.35,1),opacity .35s,background .3s;
  box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),inset 0 5px 0 rgba(255,255,255,.35),0 10px 18px -8px rgba(58,36,24,.5)}
.tile.on{box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),inset 0 5px 0 rgba(255,255,255,.35),0 18px 30px -10px rgba(58,36,24,.6)}
.tile:hover:not(.on){filter:brightness(1.07)}
.tile .em{filter:drop-shadow(0 3px 2px rgba(0,0,0,.25))}
.tile .cnt{position:absolute;right:-6px;top:-6px;min-width:22px;height:22px;border-radius:99px;background:var(--ink);color:var(--paper);
  font:500 11px/22px var(--mono);text-align:center;padding:0 5px}
.tile.plus{background:transparent;border:2px dashed var(--muted);color:var(--muted);box-shadow:none;font:300 36px var(--disp)}
.arrow{position:absolute;top:166px;width:46px;height:46px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;
  font-size:20px;transition:.15s;z-index:20}
.arrow:hover{transform:scale(1.1)}
#prev{left:max(0px,calc(50% - 400px))} #next{right:max(0px,calc(50% - 400px))}

/* ---------- card ---------- */
.card{position:relative;background:var(--card);border-radius:30px;box-shadow:var(--shadow);overflow:hidden;display:grid;grid-template-columns:230px 1fr;min-height:540px}
.dialcol{position:relative}
.dial{position:absolute;left:-170px;top:50%;width:430px;height:430px;margin-top:-215px}
.dial .trk0{fill:none;stroke:var(--line);stroke-width:2}
.dial .arc{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round;transition:stroke-dasharray .8s}
.dial .knob{fill:var(--accent);stroke:var(--card);stroke-width:3}
.dial .spin{animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.dpct{font:800 44px var(--disp);fill:var(--ink);letter-spacing:-.04em}
.dlbl{font:500 11px var(--mono);fill:var(--muted);letter-spacing:.14em}
.main{padding:34px 34px 30px 8px;min-width:0}
.top{display:grid;grid-template-columns:1fr auto;align-items:end;gap:12px;border-bottom:3px solid var(--ink)}
.ttl{padding-bottom:18px;min-width:0}
.ttl>.mono{color:var(--muted);display:block;margin-bottom:10px}
.big{margin:0;font:800 var(--fs,100px)/.86 var(--disp);font-stretch:82%;letter-spacing:-.045em;text-transform:uppercase;overflow-wrap:break-word;cursor:text}
.stks{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.stk{font:500 11.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;border:1.5px solid var(--ink);border-radius:99px;padding:4px 12px;transform:rotate(-2deg)}
.stk:nth-child(2){transform:rotate(1.5deg)} .stk:nth-child(3){transform:rotate(-1deg)} .stk:nth-child(4){transform:rotate(1deg)}
.stk:first-child{background:var(--ink);color:var(--card)}
.stk.warn{border-color:var(--accent);color:var(--accent)}
.fine{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap}
.fine button{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid transparent}
.fine button:hover{color:var(--ink);border-color:var(--ink)}

/* buttons */
.cta{background:var(--ink);color:var(--card);font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:7px 15px;border-radius:99px;white-space:nowrap;
  transition:transform .15s}
.cta:hover{transform:translateY(-1px) rotate(-1deg)}
.btn{padding:6px 15px;border-radius:99px;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;border:1.5px solid var(--ink);white-space:nowrap}
.btn:hover{background:var(--soft)}
.btn.pri{background:var(--ink);color:var(--card)} .btn.pri:hover{background:var(--ink);opacity:.9}
.btn.dng{border-color:var(--accent);color:var(--accent)} .btn.dng:hover{background:var(--accent);color:var(--card)}

/* brand edit */
.be{padding-bottom:20px}
.be>.mono{color:var(--accent);display:block;margin-bottom:8px}
#beName{width:100%;border:0;border-bottom:3px solid var(--ink);background:none;outline:0;font:800 56px/1 var(--disp);font-stretch:82%;letter-spacing:-.045em;text-transform:uppercase;padding:0 0 8px;min-width:0}
.sw,.mk{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.swb{width:28px;height:28px;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1.5px var(--line)}
.swb.on{box-shadow:0 0 0 2.5px var(--ink)}
.mkb{width:38px;height:38px;border-radius:12px;font-size:20px;border:1.5px solid var(--line);text-align:center}
.mkb.on{border-color:var(--ink);background:var(--soft)}
.berow{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.berow .dng{margin-left:auto}

/* cat */
.catwrap{position:relative;width:196px;margin-bottom:-3px;cursor:pointer;user-select:none}
.cat{display:block;width:100%;color:var(--ink);overflow:visible}
.cat .fillp{fill:var(--card)}
.cat .eyes{transform:translate(var(--ex,0px),var(--ey,0px));transition:transform .12s}
.cat .eyes circle{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
.cat .tail{transform-origin:176px 218px;animation:wag 3.4s ease-in-out infinite}
@keyframes wag{0%,100%{transform:rotate(0)}50%{transform:rotate(7deg)}}
.catwrap:hover .tail{animation-duration:.7s}
.cat .wh{transform-origin:120px 112px;animation:wh 4s ease-in-out infinite}
@keyframes wh{50%{transform:scaleX(1.03)}}
.cat.meow{animation:meow .5s}
@keyframes meow{30%{transform:translateY(-8px) rotate(-3deg)}60%{transform:translateY(0) rotate(2deg)}}
.zz{font:500 20px var(--mono);fill:var(--muted);animation:zz 2.4s ease-in-out infinite}
@keyframes zz{0%{opacity:0;transform:translateY(8px)}50%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.badge{position:absolute;left:-52px;top:-6px;width:84px;animation:spin 18s linear infinite;pointer-events:none}
.badge text{font:500 9.6px var(--mono);fill:#3a2418;letter-spacing:.04em}

/* ---------- tracklist ---------- */
.lbl{display:flex;justify-content:space-between;align-items:center;color:var(--accent);margin:20px 0 6px;min-height:30px}
.lbl>span:last-child{color:var(--muted)}
.trk{border-bottom:1px solid var(--line)}
.trow{display:grid;grid-template-columns:34px 1fr 90px 112px;gap:14px;align-items:center;width:100%;padding:13px 6px;border-radius:12px;transition:background .15s;cursor:pointer}
.trow:hover{background:var(--soft)}
.no{font:500 12px var(--mono);color:var(--muted)}
.tn{min-width:0;display:flex;flex-direction:column}
.tn b{font:700 19px/1.15 var(--disp);letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn{width:100%;border:0;border-bottom:2px solid var(--ink);background:none;outline:0;font:700 19px/1.15 var(--disp);letter-spacing:-.02em;padding:0 0 2px}
.sub{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.sdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sc);margin-right:6px}
.mbar{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--c);border-radius:9px;transition:width .5s}
.tdue{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;text-align:right;color:var(--muted);white-space:nowrap}
.tdue.bad,.due.bad{color:var(--accent)} .tdue.today,.due.today{color:var(--ink);text-decoration:underline wavy var(--yellow) 2px;text-underline-offset:4px}
.trk.open .trow .tn b{color:var(--c)}
.tbody{padding:2px 0 16px 48px;animation:drop .3s ease}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}}
.ptool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:2px 0 8px 8px}
.ptool .sp{flex:1}
.ptool .lnk{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ptool .lnk:hover{color:var(--ink)} .ptool .lnk.dng:hover{color:var(--accent)}
.st{position:relative;display:inline-flex;align-items:center;gap:6px;font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--sc,var(--muted));
  padding:3px 10px;border-radius:99px;border:1.5px solid color-mix(in srgb,var(--sc,var(--muted)) 45%,transparent);cursor:pointer;white-space:nowrap;transition:.15s}
.st:hover{background:color-mix(in srgb,var(--sc,var(--muted)) 12%,transparent)}
.st i{width:7px;height:7px;border-radius:50%;background:var(--sc,var(--muted))}
.st select,.pick select{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.chipb{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1.5px solid var(--line);color:var(--muted);white-space:nowrap}
.chipb:hover{border-color:var(--ink);color:var(--ink)} .chipb.set{color:var(--ink)}
.tk{display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.tk:hover{background:var(--soft)}
.tk.new{animation:drop .4s cubic-bezier(.3,1.5,.5,1)}
.ck{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--c,var(--ink));display:grid;place-items:center;color:var(--card);font:800 13px var(--disp);transition:.2s cubic-bezier(.3,1.6,.5,1)}
.ck:hover{transform:scale(1.15)}
.s-doing>.ck{background:linear-gradient(90deg,var(--c) 50%,transparent 50%)}
.s-review>.ck{background:conic-gradient(var(--c) 0 75%,transparent 0)}
.s-blocked>.ck{border-color:var(--accent);color:var(--accent)}
.done>.ck{background:var(--c,var(--ink))}
.txt{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.done .txt{text-decoration:line-through;color:var(--muted);font-weight:400}
.meta{display:flex;gap:10px;align-items:center;flex:none}
.cc{font:500 11.5px var(--mono);color:var(--muted)}
.ctx{font:500 11px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--c);white-space:nowrap;max-width:200px;overflow:hidden;text-overflow:ellipsis}
.due{font:500 11.5px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap;padding:3px 4px;border-radius:8px;min-width:58px;text-align:right}
.due:hover{background:var(--line);color:var(--ink)}
.due.none{opacity:0} .tk:hover .due.none{opacity:.8}
.due.soon{color:#b87a1e}
.x{color:var(--muted);opacity:0;font-size:18px;line-height:1;padding:2px 5px;border-radius:8px;transition:.15s}
.tk:hover .x{opacity:.8} .x:hover{color:var(--accent);opacity:1}
@media (hover:none){.x{opacity:.5}.due.none{opacity:.6}}
.addt{display:flex;gap:10px;align-items:center;margin-top:4px}
.addt input,.newp input{flex:1;min-width:0;border:0;border-bottom:1.5px dashed var(--line);background:none;outline:0;padding:10px 8px;font:500 13px var(--mono);letter-spacing:.02em}
.addt input:focus,.newp input:focus{border-bottom-color:var(--ink)}
.newp{display:flex;gap:10px;align-items:center;padding:12px 6px;border-bottom:1px solid var(--line)}
.grp{margin-top:20px}
.grp h3{margin:0 0 4px;display:flex;justify-content:space-between;font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.grp h3.bad{color:var(--accent)} .grp h3.today{color:var(--ink)}
.empty{padding:30px 0;color:var(--muted);font:500 13px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.nbForm{padding:40px 0}
.nbForm input{width:100%;border:0;border-bottom:3px solid var(--ink);background:none;outline:0;font:800 80px/1 var(--disp);font-stretch:82%;letter-spacing:-.045em;text-transform:uppercase;padding:0 0 10px;min-width:0}
.nbForm input::placeholder{color:var(--line)}
.nbForm p{margin-top:14px;color:var(--muted)}
footer{margin-top:26px;text-align:center;color:var(--muted)}

/* ---------- calendar view ---------- */
.cwd{display:grid;grid-template-columns:repeat(7,1fr);margin:16px 0 6px;color:var(--muted);text-align:center;font-size:11px}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line)}
.cday{min-height:84px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:6px;display:flex;flex-direction:column;gap:3px;overflow:hidden;min-width:0;transition:background .15s}
.cday:hover{background:var(--soft)} .cday.out{opacity:.42} .cday.sel{background:var(--soft);box-shadow:inset 0 0 0 2px var(--ink)}
.cday .dn{font:500 12px var(--mono);align-self:flex-start}
.cday.today .dn{background:var(--ink);color:var(--card);border-radius:99px;padding:1px 7px}
.cchips{display:flex;flex-direction:column;gap:3px;min-width:0}
.cchip{font:600 11px/1.25 var(--disp);border-left:3px solid var(--c);padding:1px 5px;background:color-mix(in srgb,var(--c) 15%,transparent);border-radius:3px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.cchip.done{text-decoration:line-through;opacity:.5}
.cmore{font:500 10px var(--mono);color:var(--muted)}
.cdots{display:none;gap:3px;flex-wrap:wrap}
.cdot{width:6px;height:6px;border-radius:50%;background:var(--c)}

/* ---------- date popover ---------- */
#calpop{position:fixed;z-index:100;width:288px;background:var(--card);border:2px solid var(--ink);border-radius:20px;box-shadow:var(--shadow);padding:12px;animation:drop .2s ease}
.cph{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.cph b{font:700 16px var(--disp)}
.cph button{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);text-align:center}
.cph button:hover{border-color:var(--ink)}
.cpw,.cpg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cpw span{font:500 10px var(--mono);color:var(--muted);padding:4px 0}
.cpg button{aspect-ratio:1;border-radius:50%;font:600 13px var(--disp);position:relative;text-align:center}
.cpg button:hover{background:var(--soft)}
.cpg .out{color:var(--muted);opacity:.55}
.cpg .tod{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cpg .on{background:var(--ink);color:var(--card)}
.cpg .has::after{content:'';position:absolute;bottom:3px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.cpq{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.cpq button{font:500 11px var(--mono);text-transform:uppercase;padding:5px 10px;border-radius:99px;border:1.5px solid var(--line)}
.cpq button:hover{border-color:var(--ink)} .cpq .clr{margin-left:auto;color:var(--accent)}

/* ---------- quick add ---------- */
#fab{position:fixed;right:20px;bottom:20px;z-index:50;background:var(--ink);color:var(--card);border-radius:99px;padding:12px 20px 12px 15px;font:500 13px var(--mono);
  text-transform:uppercase;letter-spacing:.06em;display:flex;gap:8px;align-items:center;box-shadow:var(--shadow);transition:transform .2s}
#fab span{font:400 24px/1 var(--disp)} #fab:hover{transform:translateY(-2px) rotate(-1deg)}
#qa{position:fixed;right:20px;bottom:78px;width:min(410px,calc(100vw - 24px));z-index:66;background:var(--card);border:2px solid var(--ink);border-radius:22px;
  box-shadow:var(--shadow);padding:14px 16px 16px;opacity:0;transform:translateY(14px) scale(.97);pointer-events:none;transition:.25s cubic-bezier(.3,1.4,.5,1)}
#qa.on{opacity:1;transform:none;pointer-events:auto}
.qh{display:flex;justify-content:space-between;color:var(--muted);align-items:center}
#qaClose{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);text-align:center;font-size:12px}
#qaTitle{width:100%;border:0;border-bottom:2px solid var(--ink);background:none;outline:0;font:700 20px var(--disp);letter-spacing:-.02em;padding:8px 0;margin-top:6px}
#qaTitle::placeholder{color:var(--muted);font-weight:400;font-size:16px}
.qrow{display:flex;gap:8px;margin-top:12px;align-items:center;flex-wrap:wrap}
.qrow .cta{margin-left:auto}

/* ---------- drawer ---------- */

<script>
const $ = s => document.querySelector(s);
const COLORS = ['#e8793a','#8fb6dc','#a8b64a','#8a5443','#e9a8b8','#d9b98f','#c3a2dd'];
const MARKS = ['🐱','😺','🐈','😸','🐈‍⬛','😻','😼'];
const KEY = 'purrgress.v2';
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const grow = el => { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; };

/* ---------- statuses ---------- */
const ST  = [['todo','Not started'],['doing','In progress'],['review','In review'],['blocked','Blocked'],['done','Done']];
const PST = [['todo','Not started'],['doing','In progress'],['hold','On hold'],['done','Done']];
const stLabel = (s, list = ST) => (list.find(x => x[0] === s) || list[0])[1];
const opts = (cur, list) => list.map(([k, l]) => `<option value="${k}" ${k === cur ? 'selected' : ''}>${l}</option>`).join('');

/* ---------- dates ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const todayD = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diff = s => Math.round((parse(s) - todayD()) / 864e5);
const DOW = ['sun','mon','tue','wed','thu','fri','sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONL = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const fmt = s => { const d = parse(s); return `${MON[d.getMonth()]} ${d.getDate()}`; };
const fmtLong = s => { const d = parse(s); return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`; };
function dueInfo(s){
  if (!s) return ['+ date', 'none'];
  const n = diff(s);
  if (n < -1) return [`${-n}d late`, 'bad'];
  if (n === -1) return ['Yesterday', 'bad'];
  if (n === 0) return ['Today', 'today'];
  if (n === 1) return ['Tomorrow', 'soon'];
  if (n < 7) return [`${DOW[parse(s).getDay()]} · ${n}d`, 'soon'];
  return [fmt(s), ''];
}
function ago(ts){
  const m = Math.round((Date.now() - ts) / 60000);
  if (m < 1) return 'just now';
  if (m < 60) return `${m}m ago`;
  if (m < 1440) return `${Math.round(m/60)}h ago`;
  const d = new Date(ts); return `${MON[d.getMonth()]} ${d.getDate()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
/* "send invoice fri" -> title + date */
function smartDate(text){
  const m = text.match(/^(.*?)\s+(today|tod|tomorrow|tmr|tmrw|next week|\+\d+d|sun|mon|tue|wed|thu|fri|sat)$/i);
  if (!m) return [text, ''];
  const w = m[2].toLowerCase(), t = todayD();
  let d;
  if (w.startsWith('tod')) d = t;
  else if (w.startsWith('tm')) d = addDays(t, 1);
  else if (w === 'next week') d = addDays(t, 7);
  else if (w[0] === '+') d = addDays(t, parseInt(w.slice(1)));
  else { const k = DOW.indexOf(w); d = addDays(t, ((k - t.getDay() + 6) % 7) + 1); }
  return [m[1].trim(), iso(d)];
}

/* ---------- state: brands → projects → tasks ---------- */
function seed(){
  const t = todayD();
  const B = [['Brastis',0],['Souvenir Brand',1],['Bali Wedding Fair',2]].map(([name,i]) => ({id:uid(), name, color:COLORS[i], mark:MARKS[i]}));
  const P = [[0,'Spring Campaign','doing'],[0,'Website Revamp','todo'],[1,'Packaging','doing'],[1,'Batch 02 Production','todo'],[2,'Booth & Layout','todo'],[2,'Vendors','todo']]
    .map(([b,name,status]) => ({id:uid(), bid:B[b].id, name, status, due:''}));
  const T = (p, title, off, status = 'todo') => ({id:uid(), pid:P[p].id, title, due:off==null?'':iso(addDays(t,off)), status, done:status==='done', created:Date.now(), comments:[]});
  const tasks = [
    T(0,'Finalize content plan',0,'doing'), T(0,'Review product photos',2), T(0,'Brief the photographer',-1,'done'),
    T(1,'Pick homepage layout',5), T(1,'Write about-us copy',9),
    T(2,'Pick packaging samples',-1,'blocked'), T(2,'Approve final dieline',3,'review'),
    T(3,'Confirm quantity with supplier',4), T(3,'Schedule QC check',12),
    T(4,'Confirm booth layout',6), T(4,'Order banners',8),
    T(5,'Draft vendor list',null), T(5,'Email top 5 vendors',1),
  ];
  tasks[5].comments.push({id:uid(), text:'Waiting on the supplier to send the matte kraft option.', at:Date.now()-36e5});
  P[0].due = iso(addDays(t, 10));
  return {brands:B, projects:P, tasks, tab:'brands', brand:B[0].id, open:null};
}
function migrate(old){ // v1 had flat projects → they become brands with one "General" project
  const brands = old.projects.map((p,i) => ({id:p.id, name:p.name, color:COLORS[i%COLORS.length], mark:MARKS[i%MARKS.length]}));
  const projects = brands.map(b => ({id:'g'+b.id, bid:b.id, name:'General'}));
  const tasks = old.tasks.map(t => ({...t, pid:'g'+t.pid}));
  return {brands, projects, tasks, tab:'brands', brand:brands[0]?.id || '+', open:null};
}
let S;
try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
if (!S) { try { if (window.name.startsWith('purrgress:')) S = JSON.parse(window.name.slice(10)); } catch(e){} }
if (!S || !S.brands) {
  let old; try { old = JSON.parse(localStorage.getItem('purrgress.v1')); } catch(e){}
  S = old && old.projects ? migrate(old) : seed();
}
S.tasks.forEach(t => { t.comments = t.comments || []; t.created = t.created || Date.now(); t.status = t.status || (t.done ? 'done' : 'todo'); t.done = t.status === 'done'; });
S.projects.forEach(p => { p.due = p.due || ''; if (!p.status) { const ts = S.tasks.filter(t => t.pid === p.id); p.status = ts.length && ts.every(t => t.done) ? 'done' : ts.some(t => t.status !== 'todo') ? 'doing' : 'todo'; } });
const now = new Date();
S.cal = S.cal || {y:now.getFullYear(), m:now.getMonth(), sel:iso(now)};
if (!['brands','calendar','deadlines'].includes(S.tab)) S.tab = 'brands';
if (S.brand !== '+' && !S.brands.some(b => b.id === S.brand)) S.brand = S.brands[0]?.id || '+';
S.adding = false; S.edit = null;
let saveOK = true, savedT;
function save(){
  const {adding, edit, ...rest} = S, j = JSON.stringify(rest);
  try { localStorage.setItem(KEY, j); saveOK = localStorage.getItem(KEY) === j; } catch(e){ saveOK = false; }
  if (!saveOK) { try { window.name = 'purrgress:' + j; } catch(e){} } // last-resort: survives reloads of this tab
  const el = $('#saved'); if (!el) return;
  el.className = 'mono' + (saveOK ? ' ok' : ' bad');
  el.textContent = saveOK ? 'Saved ✓' : '⚠ Not saved — open in a normal tab';
  clearTimeout(savedT); if (saveOK) savedT = setTimeout(() => el.classList.remove('ok'), 1800);
}
const brandOf = id => S.brands.find(b => b.id === id);
const projOf = id => S.projects.find(p => p.id === id);
const task = id => S.tasks.find(t => t.id === id);
function ctx(t){ const p = projOf(t.pid) || {name:'?', bid:null}; const b = brandOf(p.bid) || {name:'?', color:'#999'}; return {p, b}; }
let lastAdded = null, focusAdd = false;

/* a task's status moves the project along automatically (you can still override it) */
function autoProject(pid){
  const p = projOf(pid); if (!p || p.status === 'hold') return;
  const ts = S.tasks.filter(t => t.pid === pid);
  if (ts.length && ts.every(t => t.status === 'done')) p.status = 'done';
  else if (p.status === 'done') p.status = 'doing';
  else if (p.status === 'todo' && ts.some(t => t.status !== 'todo')) p.status = 'doing';
}
function setStatus(t, s){ t.status = s; t.done = s === 'done'; autoProject(t.pid); save(); }

const byDue = (a, b) => (a.due || '9') < (b.due || '9') ? -1 : (a.due || '9') > (b.due || '9') ? 1 : 0;
function stats(ts){
  const done = ts.filter(t => t.done).length, open = ts.filter(t => !t.done);
  const dues = open.filter(t => t.due).map(t => t.due).sort();
  return {total:ts.length, done, open:open.length, pct:ts.length ? Math.round(done/ts.length*100) : 0, next:dues[0] || '',
          overdue:open.filter(t => t.due && diff(t.due) < 0).length, blocked:open.filter(t => t.status === 'blocked').length};
}
const tasksOfBrand = b => { const ids = new Set(S.projects.filter(p => p.bid === b.id).map(p => p.id)); return S.tasks.filter(t => ids.has(t.pid)); };

/* ---------- cat + dial art ---------- */
function catSVG(sleep){
  return `<svg class="cat" viewBox="0 0 240 230" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-label="A cat">
  <g class="tail"><path d="M176 218 C222 218 238 168 214 138 C206 128 194 134 202 148"/></g>
  <path class="fillp" d="M84 140 C66 170 64 200 72 218 H168 C176 200 174 170 156 140"/>
  <path d="M150 170 C161 164 170 174 165 188 C158 194 147 188 150 170Z" fill="currentColor" stroke="none"/>
  <path class="fillp" d="M88 218 V194 Q88 180 99 180 Q110 180 110 194 V218"/>
  <path class="fillp" d="M130 218 V194 Q130 180 141 180 Q152 180 152 194 V218"/>
  <path d="M99 196 V206 M141 196 V206" stroke-width="3"/>
  <path class="fillp" d="M60 98 C58 64 64 40 72 24 L98 46 C110 41 130 41 142 46 L168 24 C176 40 182 64 180 98 C178 128 152 146 120 146 C88 146 62 128 60 98Z"/>
  <path d="M76 38 L90 50 M164 38 L150 50" stroke-width="3"/>
  <path d="M112 58 V70 M120 54 V70 M128 58 V70" stroke-width="3.5"/>
  <ellipse cx="80" cy="110" rx="8" ry="7" fill="currentColor" stroke="none"/><ellipse cx="160" cy="110" rx="8" ry="7" fill="currentColor" stroke="none"/>
  ${sleep
    ? `<path d="M90 95 q7 6 14 0 M136 95 q7 6 14 0" stroke-width="3.5"/><text class="zz" x="186" y="44">z</text>`
    : `<g class="eyes"><circle cx="97" cy="94" r="4.8" fill="currentColor" stroke="none"/><circle cx="143" cy="94" r="4.8" fill="currentColor" stroke="none"/></g>`}
  <path d="M115 107 h10 l-5 7z" fill="currentColor" stroke-width="2"/>
  <path d="M120 114 q-4 9 -13 5 M120 114 q4 9 13 5" stroke-width="3"/>
  <g class="wh" stroke-width="2.6"><path d="M64 104 L26 96 M64 112 L24 114 M66 120 L30 132"/><path d="M176 104 L214 96 M176 112 L216 114 M174 120 L210 132"/></g>
</svg>`;
}
const badgeSVG = `<svg class="badge" viewBox="0 0 120 120"><defs><path id="circ" d="M60,60 m-45,0 a45,45 0 1,1 90,0 a45,45 0 1,1 -90,0"/></defs>
  <circle cx="60" cy="60" r="58" fill="#f2c53d"/><circle cx="60" cy="60" r="56" fill="none" stroke="#3a2418" stroke-width="1" stroke-dasharray="2 3"/>
  <text><textPath href="#circ" textLength="276" lengthAdjust="spacing">PURR·GRESS · ONE TASK AT A TIME · </textPath></text>
  <text x="60" y="71" text-anchor="middle" font-size="30">🐾</text></svg>`;
function dialSVG(pct, color, label){
  const C = 2*Math.PI*190, p = pct/100, a = p*2*Math.PI;
  return `<svg class="dial" viewBox="-215 -215 430 430" aria-hidden="true">
    <circle r="190" class="trk0"/>
    <circle r="190" class="arc" stroke-dasharray="${(C*p).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90)"/>
    <circle cx="${(190*Math.sin(a)).toFixed(1)}" cy="${(-190*Math.cos(a)).toFixed(1)}" r="8" class="knob"/>
    <circle r="168" fill="#17110e"/>
    <g class="spin">${[152,136,120,104,88].map(r => `<circle r="${r}" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="1.5"/>`).join('')}
      <path d="M0 -168 A168 168 0 0 1 89 -142.5 L0 0Z" fill="rgba(255,255,255,.09)"/>
      <path d="M0 168 A168 168 0 0 1 -89 142.5 L0 0Z" fill="rgba(255,255,255,.09)"/></g>

/* ---------- render ---------- */
function render(){

  if (focusAdd) { $('.addt input')?.focus(); focusAdd = false; }

}
function renderNav(){ document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab)); }

const tileEls = new Map();
const items = () => [...S.brands.map(b => ({id:b.id, b})), {id:'+'}];
function renderStage(){
  const stage = $('#stage'); stage.hidden = S.tab !== 'brands'; if (stage.hidden) return;
  const it = items(), ai = Math.max(0, it.findIndex(x => x.id === S.brand));
  const mob = innerWidth < 760, R = mob ? 220 : 360, step = (mob ? 21 : 17) * Math.PI / 180, vis = mob ? 2 : 3;
  const keep = new Set(it.map(x => x.id)), box = $('#tiles');
  tileEls.forEach((el, id) => { if (!keep.has(id)) { el.remove(); tileEls.delete(id); } });
  it.forEach((x, i) => {
    let el = tileEls.get(x.id);
    if (!el) { el = document.createElement('button'); el.className = 'tile'; el.dataset.id = x.id; box.appendChild(el); tileEls.set(x.id, el); }
    const k = i - ai, a = k * step, on = k === 0, far = Math.abs(k) > vis;
    el.style.transform = `translate(-50%,0) translate(${(R*Math.sin(a)).toFixed(1)}px,${(R*(1-Math.cos(a)) - (on ? 22 : 0)).toFixed(1)}px) rotate(${on || !x.b ? 0 : a}rad) scale(${on ? 1.32 : 1})`;
    el.style.opacity = far ? 0 : 1; el.style.pointerEvents = far ? 'none' : 'auto'; el.style.zIndex = 10 - Math.abs(k);
    el.classList.toggle('on', on);
    if (x.b) {
      const open = stats(tasksOfBrand(x.b)).open;
      el.style.setProperty('--t', x.b.color); el.title = x.b.name;
      el.innerHTML = `<span class="em">${x.b.mark}</span>${open ? `<i class="cnt">${open}</i>` : ''}`;
    } else { el.classList.add('plus'); el.title = 'New brand'; el.textContent = '+'; }
  });
  $('#arcLabel').textContent = S.brand === '+' ? 'New brand' : (brandOf(S.brand)?.name || '');
}

function tkRow(t, showCtx){

const sortTasks = ts => [...ts.filter(t => !t.done).sort(byDue), ...ts.filter(t => t.done)];
const fs = n => n <= 6 ? 112 : n <= 10 ? 92 : n <= 16 ? 72 : 56;

function shell({kicker, title, stk, pct, color, dialLabel, sleep, body, fine = '', head = null, rename = false}){

        <div class="ptool">

  return shell({

    stk:[`${ps.length} project${ps.length === 1 ? '' : 's'}`, `${s.open} open`, s.next ? `next · ${dueInfo(s.next)[0]}` : 'no deadline', ...(s.blocked ? [{t:`⚠ ${s.blocked} blocked`, warn:true}] : [])],
    pct:s.pct, color:ed ? ed.color : b.color, dialLabel:'DONE', sleep:s.total > 0 && !s.open, body,
    fine:`<div class="fine"><button data-a="eb">Edit brand</button></div>`});
}

function cardDeadlines(){
  const ps = new Set(S.projects.map(p => p.id)), all = S.tasks.filter(t => ps.has(t.pid)), s = stats(all);
  const open = all.filter(t => !t.done).sort(byDue), td = open.filter(t => t.due && diff(t.due) === 0).length;
  const G = [['Overdue','bad',t => t.due && diff(t.due) < 0],['Today','today',t => t.due && diff(t.due) === 0],
    ['Tomorrow','',t => t.due && diff(t.due) === 1],['This week','',t => t.due && diff(t.due) > 1 && diff(t.due) <= 7],
    ['Later','',t => t.due && diff(t.due) > 7],['No date','',t => !t.due]];
  const body = `<div class="lbl mono"><span>Everything, by deadline</span><span>${open.length} open</span></div>` +
    (open.length ? G.map(([n, c, f]) => { const g = open.filter(f); return g.length ? `<section class="grp"><h3 class="${c}"><span>${n}</span><span>${g.length}</span></h3>${g.map(t => tkRow(t, true)).join('')}</section>` : ''; }).join('')
                 : `<div class="empty">Nothing due. Nap time 😽</div>`);
  return shell({kicker:'ALL BRANDS', title:'Deadlines', stk:[`${open.length} open`, `${s.overdue} overdue`, `${td} today`, ...(s.blocked ? [{t:`⚠ ${s.blocked} blocked`, warn:true}] : [])],
    pct:s.pct, color:'var(--accent)', dialLabel:'OVERALL', sleep:s.total > 0 && !s.open, body});
}

function cardCalendar(){
  const {y, m, sel} = S.cal, ps = new Set(S.projects.map(p => p.id)), by = {};
  S.tasks.forEach(t => { if (t.due && ps.has(t.pid)) (by[t.due] = by[t.due] || []).push(t); });
  const first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, start = addDays(first, -off);
  const weeks = Math.ceil((off + new Date(y, m + 1, 0).getDate()) / 7), td = iso(new Date());
  let cells = '';
  for (let i = 0; i < weeks * 7; i++) {
    const d = addDays(start, i), k = iso(d), ts = by[k] || [];
    cells += `<button class="cday ${d.getMonth() !== m ? 'out' : ''} ${k === td ? 'today' : ''} ${k === sel ? 'sel' : ''}" data-d="${k}" aria-label="${fmtLong(k)}, ${ts.length} tasks">
      <span class="dn">${d.getDate()}</span>
      <span class="cchips">${ts.slice(0, 2).map(t => `<span class="cchip ${t.done ? 'done' : ''}" style="--c:${ctx(t).b.color}">${esc(t.title)}</span>`).join('')}${ts.length > 2 ? `<span class="cmore">+${ts.length - 2} more</span>` : ''}</span>
      <span class="cdots">${ts.slice(0, 5).map(t => `<i class="cdot" style="--c:${ctx(t).b.color}"></i>`).join('')}</span></button>`;
  }
  const inMonth = S.tasks.filter(t => ps.has(t.pid) && t.due && parse(t.due).getMonth() === m && parse(t.due).getFullYear() === y), s = stats(inMonth);
  const day = sel ? (by[sel] || []) : [];
  const body = `<div class="cwd mono">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d => `<span>${d}</span>`).join('')}</div>
    <div class="cgrid">${cells}</div>
    ${sel ? `<div class="lbl mono"><span>${fmtLong(sel)}</span><button class="cta" data-a="calnew">+ Task</button></div>
      ${day.length ? sortTasks(day).map(t => tkRow(t, true)).join('') : '<div class="empty">Nothing planned for this day.</div>'}` : ''}`;
  return shell({kicker:String(y), title:MONL[m], stk:[`${inMonth.length} due`, `${s.done} done`, `${s.open} open`, ...(s.overdue ? [{t:`${s.overdue} overdue`, warn:true}] : [])],
    pct:s.pct, color:'var(--accent)', dialLabel:'THIS MONTH', sleep:s.total > 0 && !s.open, body,
    fine:`<div class="fine"><button data-a="cprev">‹ Prev</button><button data-a="ctoday">Today</button><button data-a="cnext">Next ›</button></div>`});
}

/* ---------- toast / undo ---------- */
let tt, undoFn;
function toast(msg, undo){
  $('#toastMsg').textContent = msg; undoFn = undo; $('#toastUndo').hidden = !undo;
  $('#toast').classList.add('on'); clearTimeout(tt); tt = setTimeout(() => $('#toast').classList.remove('on'), 5500);
}
$('#toastUndo').onclick = () => { undoFn && undoFn(); $('#toast').classList.remove('on'); };
function snapshotUndo(msg){
  const snap = JSON.stringify(S, (k, v) => k === 'edit' || k === 'adding' ? undefined : v);
  toast(msg, () => { S = JSON.parse(snap); S.adding = false; S.edit = null; save(); render(); if (openId && !task(openId)) closeDrawer(); });
}
function removeTask(t){ snapshotUndo('Task deleted'); S.tasks = S.tasks.filter(x => x !== t); autoProject(t.pid); save(); render(); }

/* ---------- date picker popover ---------- */
let cal = null;
function closeCal(){ if (cal) { cal.el.remove(); cal = null; } }
function openCal(anchor, value, cb){
  if (cal && cal.anchor === anchor) return closeCal();
  closeCal();
  const base = value ? parse(value) : todayD();
  cal = {y:base.getFullYear(), m:base.getMonth(), value, cb, anchor, el:document.createElement('div')};
  cal.el.id = 'calpop'; cal.el.setAttribute('role', 'dialog'); cal.el.setAttribute('aria-label', 'Pick a date');
  document.body.appendChild(cal.el); drawCal();
  const r = anchor.getBoundingClientRect(), w = 288, h = cal.el.offsetHeight;
  let left = Math.min(Math.max(8, r.left), innerWidth - w - 8), top = r.bottom + 6;
  if (top + h > innerHeight - 8) top = Math.max(8, r.top - h - 6);
  cal.el.style.left = left + 'px'; cal.el.style.top = top + 'px';
}
function drawCal(){
  const {y, m, value} = cal, first = new Date(y, m, 1), off = (first.getDay() + 6) % 7, start = addDays(first, -off), td = iso(new Date());
  const has = new Set(S.tasks.filter(t => t.due && !t.done).map(t => t.due));
  let days = '';
  for (let i = 0; i < 42; i++) {
    const d = addDays(start, i), k = iso(d);
    days += `<button type="button" data-d="${k}" class="${d.getMonth() !== m ? 'out' : ''} ${k === td ? 'tod' : ''} ${k === value ? 'on' : ''} ${has.has(k) ? 'has' : ''}">${d.getDate()}</button>`;
  }
  cal.el.innerHTML = `<div class="cph"><button type="button" data-nav="-1" aria-label="Previous month">‹</button><b>${MONL[m]} ${y}</b><button type="button" data-nav="1" aria-label="Next month">›</button></div>
    <div class="cpw">${['M','T','W','T','F','S','S'].map(d => `<span>${d}</span>`).join('')}</div><div class="cpg">${days}</div>
    <div class="cpq"><button type="button" data-q="0">Today</button><button type="button" data-q="1">Tomorrow</button><button type="button" data-q="mon">Next Mon</button>${value ? '<button type="button" class="clr" data-q="clear">Clear</button>' : ''}</div>`;
}
document.addEventListener('click', e => {
  if (!cal || !cal.el.contains(e.target)) return;
  const n = e.target.closest('[data-nav]'), d = e.target.closest('[data-d]'), q = e.target.closest('[data-q]');
  if (n) { cal.m += +n.dataset.nav; if (cal.m < 0) { cal.m = 11; cal.y--; } if (cal.m > 11) { cal.m = 0; cal.y++; } drawCal(); return; }
  let v = null;
  if (d) v = d.dataset.d;
  if (q) { const t = todayD(); v = q.dataset.q === 'clear' ? '' : q.dataset.q === 'mon' ? iso(addDays(t, ((8 - t.getDay()) % 7) || 7)) : iso(addDays(t, +q.dataset.q)); }
  if (v !== null) { const cb = cal.cb; closeCal(); cb(v); }
});
document.addEventListener('pointerdown', e => {
  if (cal && !cal.el.contains(e.target) && !cal.anchor.contains(e.target)) closeCal();
  if (qaOpen && !$('#qa').contains(e.target) && !$('#fab').contains(e.target) && !e.target.closest('#calpop,#toast')) closeQA();
}, true);

function step(d){ const it = items(), i = it.findIndex(x => x.id === S.brand), n = it[i + d]; if (n) goBrand(n.id); }

$('#card').addEventListener('click', e => {
  if (e.target.closest('#catwrap')) return petCat();
  if (e.target.closest('.rn')) return;
  const a = e.target.closest('[data-a]')?.dataset.a, row = e.target.closest('.tk');
  if (row) {
    const t = task(row.dataset.id);
    if (a === 'ck') return toggleDone(t, e.clientX, e.clientY);
    if (a === 'del') return removeTask(t);
    if (a === 'pickdate') return openCal(e.target.closest('.due'), t.due, v => { t.due = v; save(); render(); });
    if (e.target.closest('.st')) return;
    return openTask(t.id);
  }
  const pid = e.target.closest('.trk')?.dataset.pid;
  if (e.target.closest('.ptool .st')) return;
  if (a === 'toggle') return toggleProject(pid);
  if (a === 'pdue') { const p = projOf(pid); return openCal(e.target.closest('.chipb'), p.due, v => { p.due = v; save(); render(); }); }
  if (a === 'newp') { S.adding = true; S.edit = null; render(); return $('#npIn')?.focus(); }
  if (a === 'renp') { S.edit = {k:'proj', id:pid}; return render(); }
  if (a === 'rensave') return commitProj($('.rn')?.value || '');
  if (a === 'rencancel') { S.edit = null; return render(); }
  if (a === 'delp') {
    const p = projOf(pid); snapshotUndo(`“${p.name}” deleted`);
    S.projects = S.projects.filter(x => x !== p); S.tasks = S.tasks.filter(t => t.pid !== p.id); S.open = null; save(); return render();
  }
  if (a === 'eb') return editBrand();
  if (a === 'becancel') { S.edit = null; return render(); }
  if (a === 'delb') {
    const b = brandOf(S.brand); snapshotUndo(`${b.name} deleted`);
    const pids = new Set(S.projects.filter(p => p.bid === b.id).map(p => p.id));
    S.tasks = S.tasks.filter(t => !pids.has(t.pid)); S.projects = S.projects.filter(p => p.bid !== b.id);
    S.brands = S.brands.filter(x => x !== b); S.brand = S.brands[0]?.id || '+'; S.open = null; S.edit = null; save(); return render();
  }
  const sw = e.target.closest('[data-color]'), mk = e.target.closest('[data-mark]');
  if ((sw || mk) && S.edit?.k === 'brand') {
    S.edit.d.name = $('#beName').value; if (sw) S.edit.d.color = sw.dataset.color; else S.edit.d.mark = mk.dataset.mark;
    render(); const i = $('#beName'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); return;
  }
  const day = e.target.closest('.cday');
  if (day) { S.cal.sel = day.dataset.d; const d = parse(S.cal.sel); S.cal.y = d.getFullYear(); S.cal.m = d.getMonth(); save(); return render(); }
  if (a === 'cprev' || a === 'cnext') { S.cal.m += a === 'cnext' ? 1 : -1; if (S.cal.m < 0) { S.cal.m = 11; S.cal.y--; } if (S.cal.m > 11) { S.cal.m = 0; S.cal.y++; } save(); return render(); }
  if (a === 'ctoday') { const n = new Date(); S.cal = {y:n.getFullYear(), m:n.getMonth(), sel:iso(n)}; save(); return render(); }
  if (a === 'calnew') return openQA({due:S.cal.sel});
});
$('#card').addEventListener('dblclick', e => { if (e.target.closest('.big[data-a="eb"]')) editBrand(); });
$('#card').addEventListener('submit', e => {

  }
  if (f.id === 'npForm') {
    const v = $('#npIn').value.trim(); S.adding = false;
    if (v) { const p = {id:uid(), bid:S.brand, name:v, status:'todo', due:''}; S.projects.push(p); S.open = p.id; focusAdd = true; save(); }
    return render();
  }
  if (f.classList.contains('addt')) {
    const inp = f.querySelector('input'), raw = inp.value.trim(); if (!raw) return;
    const [title, due] = smartDate(raw);
    const t = {id:uid(), pid:f.dataset.pid, title, due, status:'todo', done:false, created:Date.now(), comments:[]};
    S.tasks.push(t); autoProject(t.pid); lastAdded = t.id; focusAdd = true;
    if (/\b(meow|cat|kitty|kucing|miaw)\b/i.test(raw)) { catRain(); say('MEOW! 🐾'); }
    save(); render();
  }
});
$('#card').addEventListener('keydown', e => {
  const t = e.target;
  if (t.classList.contains('rn')) {
    if (e.key === 'Enter') { e.preventDefault(); commitProj(t.value); }
    if (e.key === 'Escape') { e.stopPropagation(); S.edit = null; render(); }
  } else if (t.id === 'npIn' && e.key === 'Escape') { e.stopPropagation(); S.adding = false; render(); }
  else if ((t.id === 'beName') && e.key === 'Escape') { e.stopPropagation(); S.edit = null; render(); }
  else if (t.classList.contains('trow') && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleProject(t.closest('.trk').dataset.pid); }
});
$('#card').addEventListener('focusout', e => {
  const t = e.target;
  if (t.id === 'npIn' && S.adding && !t.value.trim() && !(e.relatedTarget && e.relatedTarget.closest?.('#npForm'))) { S.adding = false; render(); }
});
$('#card').addEventListener('change', e => {
  const a = e.target.dataset.a;
  if (a === 'status') { const t = task(e.target.closest('.tk').dataset.id); setStatus(t, e.target.value); render(); if (t.done) { paw(innerWidth / 2, innerHeight / 2); } }
  if (a === 'pstatus') { projOf(e.target.closest('.trk').dataset.pid).status = e.target.value; save(); render(); }
});

function toggleDone(t, x, y){
  setStatus(t, t.done ? 'todo' : 'done');
  if (t.done) { if (x != null) paw(x, y); if (Math.random() < .25) say(pick(PRAISE)); }
  render();
  const s = stats(S.tab === 'brands' && brandOf(S.brand) ? tasksOfBrand(brandOf(S.brand)) : S.tasks);
  if (t.done && s.total && !s.open) { catRain(14); say('All done here. Treats! 🐟'); }
}

/* ---------- quick add (FAB / N key) ---------- */
let qaOpen = false, qa = {pid:'', due:''};
function qaDraw(){
  $('#qaProj').innerHTML = S.brands.map(x => `<optgroup label="${esc(x.name)}">${S.projects.filter(q => q.bid === x.id).map(q => `<option value="${q.id}">${esc(q.name)}</option>`).join('')}</optgroup>`).join('');
  $('#qaProj').value = qa.pid;
  const p = projOf(qa.pid), b = brandOf(p?.bid);
  $('#qaProjLbl').innerHTML = p ? `<span class="pdot" style="background:${b.color}"></span> ${esc(b.name)} / ${esc(p.name)}` : 'Project';
  $('#qaDate').textContent = '📅 ' + (qa.due ? dueInfo(qa.due)[0] : 'Date'); $('#qaDate').classList.toggle('set', !!qa.due);
}
function openQA(pre = {}){
  if (!S.projects.length) { toast('Add a brand and a project first'); return; }
  qa.pid = pre.pid || (projOf(S.open) ? S.open : '') || S.projects.find(p => p.bid === S.brand)?.id || S.projects[0].id;
  qa.due = pre.due || '';
  qaOpen = true; qaDraw(); $('#qa').classList.add('on'); $('#qaTitle').focus();
}
function closeQA(){ qaOpen = false; $('#qa').classList.remove('on'); closeCal(); }
$('#fab').onclick = () => qaOpen ? closeQA() : openQA();
$('#qaClose').onclick = closeQA;
$('#qaProj').onchange = e => { qa.pid = e.target.value; qaDraw(); };
$('#qaDate').onclick = e => openCal(e.currentTarget, qa.due, v => { qa.due = v; qaDraw(); $('#qaTitle').focus(); });
$('#qa').addEventListener('submit', e => {
  e.preventDefault();
  const raw = $('#qaTitle').value.trim(); if (!raw) return $('#qaTitle').focus();
  const [title, due] = smartDate(raw);
  const t = {id:uid(), pid:qa.pid, title, due:qa.due || due, status:'todo', done:false, created:Date.now(), comments:[]};
  S.tasks.push(t); autoProject(t.pid); save();
  const {p, b} = ctx(t);
  toast(`Added → ${b.name} / ${p.name}`, () => { S.tasks = S.tasks.filter(x => x !== t); autoProject(t.pid); save(); render(); });
  if (/\b(meow|cat|kitty|kucing|miaw)\b/i.test(raw)) { catRain(); say('MEOW! 🐾'); }
  $('#qaTitle').value = ''; qa.due = ''; qaDraw(); lastAdded = t.id; render(); $('#qaTitle').focus();
});

/* ---------- drawer: edit + comments ---------- */
let openId = null, editingCid = null;
function openTask(id){
  openId = id; editingCid = null; fillDrawer();
  $('#scrim').classList.add('on'); $('#drawer').classList.add('on'); $('#drawer').setAttribute('aria-hidden', 'false');
  $('#cIn').value = ''; grow($('#cIn'));
}
function closeDrawer(){
  if (!openId) return;
  const t = task(openId); if (t && !t.title.trim()) t.title = 'Untitled';
  openId = null; save(); closeCal();
  $('#scrim').classList.remove('on'); $('#drawer').classList.remove('on'); $('#drawer').setAttribute('aria-hidden', 'true');
  render();
}
function fillDrawer(){
  const t = task(openId), {p, b} = ctx(t);
  $('#crumb').textContent = `${b.name} / ${p.name}`;
  $('#dTitle').value = t.title; grow($('#dTitle'));
  const ck = $('#dCk'); ck.textContent = t.done ? '✓' : t.status === 'blocked' ? '!' : ''; ck.style.setProperty('--c', b.color);
  ck.className = `ck s-${t.status} ${t.done ? 'done' : ''}`;
  $('#dSt').innerHTML = opts(t.status, ST); $('#dStLbl').textContent = stLabel(t.status); $('#dStPick').className = `st s-${t.status}`;
  $('#dProj').innerHTML = S.brands.map(x => `<optgroup label="${esc(x.name)}">${S.projects.filter(q => q.bid === x.id).map(q => `<option value="${q.id}">${esc(q.name)}</option>`).join('')}</optgroup>`).join('');
  $('#dProj').value = t.pid;
  $('#dProjLbl').innerHTML = `<span class="pdot" style="background:${b.color}"></span> ${esc(p.name)}`;
  $('#dDatePick').textContent = '📅 ' + (t.due ? dueInfo(t.due)[0] : 'Set deadline'); $('#dDatePick').classList.toggle('set', !!t.due);
  $('#dClear').hidden = !t.due;
  const d = new Date(t.created); $('#created').textContent = `Created ${MON[d.getMonth()]} ${d.getDate()}`;
  renderComments();
}
function renderComments(){
  const t = task(openId), {b} = ctx(t), box = $('#cmts');
  $('#cCount').textContent = t.comments.length ? `· ${t.comments.length}` : '';
  if (!t.comments.length) { box.innerHTML = `<div class="nocm"><span>🐈‍⬛</span>No comments yet. A cat is watching.</div>`; return; }
  box.innerHTML = t.comments.map(c => `
    <div class="cm" data-cid="${c.id}" style="--c:${b.color}">
      <div class="av">🐱</div>
      <div class="cb">
        <div class="ch"><b>You</b><span>${ago(c.at)}${c.edited ? ' · edited' : ''}</span>
          ${editingCid === c.id ? '' : `<span class="acts"><button data-a="cedit">Edit</button><button data-a="cdel">Delete</button></span>`}</div>
        ${editingCid === c.id
          ? `<div class="cedit"><textarea rows="2" maxlength="1000">${esc(c.text)}</textarea><div class="crow"><button class="btn" data-a="ccancel">Cancel</button><button class="btn pri" data-a="csave">Save</button></div></div>`
          : `<div class="ct">${esc(c.text)}</div>`}
      </div>
    </div>`).join('');
  const ta = box.querySelector('textarea');
  if (ta) { grow(ta); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
}
$('#dClose').onclick = $('#scrim').onclick = closeDrawer;
$('#dTitle').addEventListener('input', e => { task(openId).title = e.target.value; grow(e.target); save(); });
$('#dTitle').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur(); } });
$('#dTitle').addEventListener('blur', e => { const t = task(openId); if (t && !t.title.trim()) { t.title = 'Untitled'; e.target.value = t.title; save(); } });
$('#dCk').onclick = e => { toggleDone(task(openId), e.clientX, e.clientY); fillDrawer(); };
$('#dSt').onchange = e => { setStatus(task(openId), e.target.value); fillDrawer(); render(); };
$('#dProj').onchange = e => { const t = task(openId), old = t.pid; t.pid = e.target.value; autoProject(old); autoProject(t.pid); save(); fillDrawer(); render(); };
$('#dDatePick').onclick = e => { const t = task(openId); openCal(e.currentTarget, t.due, v => { t.due = v; save(); fillDrawer(); render(); }); };
$('#dClear').onclick = () => { task(openId).due = ''; save(); fillDrawer(); render(); };
$('#dSave').onclick = () => { closeDrawer(); save(); toast('Saved ✓'); };
$('#dDel').onclick = () => { const t = task(openId); closeDrawer(); removeTask(t); };

$('#cIn').addEventListener('input', e => grow(e.target));
$('#cIn').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('#cform').requestSubmit(); } });
$('#cform').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('#cIn').value.trim(); if (!text) return;
  task(openId).comments.push({id:uid(), text, at:Date.now()});
  $('#cIn').value = ''; grow($('#cIn')); save(); renderComments(); render();
  const bd = document.querySelector('.dbody'); bd.scrollTop = bd.scrollHeight;
  if (/\b(meow|cat|kitty)\b/i.test(text)) { catRain(12); say('Meow to you too 🐾'); }
});
$('#cmts').addEventListener('click', e => {
  const a = e.target.closest('[data-a]')?.dataset.a, cm = e.target.closest('.cm'); if (!a || !cm) return;
  const t = task(openId), c = t.comments.find(x => x.id === cm.dataset.cid);
  if (a === 'cedit') { editingCid = c.id; renderComments(); }
  if (a === 'ccancel') { editingCid = null; renderComments(); }
  if (a === 'csave') saveComment(cm, c);
  if (a === 'cdel') {
    const i = t.comments.indexOf(c); t.comments.splice(i, 1); save(); renderComments(); render();
    toast('Comment deleted', () => { t.comments.splice(i, 0, c); save(); if (openId === t.id) renderComments(); render(); });
  }
});
$('#cmts').addEventListener('keydown', e => {
  const ta = e.target.closest('.cedit textarea'); if (!ta) return;
  const cm = ta.closest('.cm'), c = task(openId).comments.find(x => x.id === cm.dataset.cid);
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); saveComment(cm, c); }
  if (e.key === 'Escape') { e.stopPropagation(); editingCid = null; renderComments(); }
});
function saveComment(cm, c){
  const v = cm.querySelector('textarea').value.trim();
  if (v && v !== c.text) { c.text = v; c.edited = true; save(); }
  editingCid = null; renderComments();
}

/* ---------- global keys ---------- */
const typing = el => el.matches('input,select,textarea,[contenteditable="true"]');
addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (cal) return closeCal();
    if (qaOpen) return closeQA();
    if (openId) return closeDrawer();
    return;
  }
  if (typing(e.target) || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'n' && !openId) { e.preventDefault(); return openTask_or_QA(); }
  if (!openId && S.tab === 'brands') { if (e.key === 'ArrowRight') step(1); if (e.key === 'ArrowLeft') step(-1); }
  buf = (buf + e.key).slice(-4).toLowerCase();
  if (buf === 'meow') { catRain(); say('MEOW! 🐾'); }
});
const openTask_or_QA = () => qaOpen ? $('#qaTitle').focus() : openQA();
let buf = '';

/* ---------- clock ---------- */
let lastDay = iso(new Date());
function tick(){
  const d = new Date();
  $('#clock').textContent = `${d.toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'})} · ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  if (iso(d) !== lastDay) { lastDay = iso(d); render(); }
}
tick(); setInterval(tick, 20000);

/* ---------- cats ---------- */
const PRAISE = ['Purr-fect! 😻','Nice paw-ork! 🐾','You’re on a roll 🐈','Meow-velous! ✨','Another one down 😸'];
const MEOWS = ['meow~','prrrr…','*slow blink* 😌','feed me? 🐟','mrrp!','you’re doing great 💛','nap after this?'];
const pick = a => a[Math.floor(Math.random() * a.length)];
let bt;
function say(msg){ const b = $('#bubble'); b.textContent = msg; b.classList.add('on'); clearTimeout(bt); bt = setTimeout(() => b.classList.remove('on'), 2400); }
function paw(x, y){ const p = document.createElement('span'); p.className = 'paw'; p.textContent = '🐾'; p.style.left = x - 10 + 'px'; p.style.top = y - 10 + 'px'; document.body.appendChild(p); setTimeout(() => p.remove(), 900); }
function catRain(n = 28){
  const set = ['🐱','😺','😸','😻','🐈','🐈‍⬛','🐾','😽'];
  for (let i = 0; i < n; i++) {
    const s = document.createElement('span'); s.className = 'fall'; s.textContent = pick(set);
    s.style.left = Math.random() * 96 + 'vw'; s.style.fontSize = 20 + Math.random() * 26 + 'px';
    s.style.animationDuration = 2.2 + Math.random() * 2.2 + 's'; s.style.animationDelay = Math.random() * 1.2 + 's';
    document.body.appendChild(s); setTimeout(() => s.remove(), 6000);
  }
}
let pets = 0, petT;
function bump(){ pets++; clearTimeout(petT); petT = setTimeout(() => pets = 0, 1500); if (pets >= 7) { pets = 0; catRain(); say('Cat party! 🎉'); return true; } }
function petCat(){
  const c = document.querySelector('.cat'); if (c) { c.classList.remove('meow'); void c.getBoundingClientRect(); c.classList.add('meow'); }
  if (!bump()) say(pick(MEOWS));
}
$('#logo').addEventListener('click', () => { if (!bump()) say(pick(MEOWS)); });
addEventListener('pointermove', e => { // the hero cat's eyes follow your pointer
  const c = document.querySelector('.cat'); if (!c) return;
  const r = c.getBoundingClientRect(), dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height * .4);
  const m = Math.hypot(dx, dy) || 1, k = Math.min(m / 140, 1), s = document.documentElement.style;
  s.setProperty('--ex', (dx / m * k * 4).toFixed(1) + 'px'); s.setProperty('--ey', (dy / m * k * 3.5).toFixed(1) + 'px');
}, {passive:true});
function walker(){
  if (document.hidden) return schedule();
  const w = document.createElement('div'); w.id = 'walker'; w.innerHTML = '<span>🐈</span>'; document.body.appendChild(w);
  w.onclick = () => { say('prrrrr… 💕'); paw(w.getBoundingClientRect().left + 20, innerHeight - 60); };
  w.onanimationend = () => { w.remove(); schedule(); };
}
const schedule = () => setTimeout(walker, 45000 + Math.random() * 60000);
setTimeout(walker, 20000);

render();
</script>
</body>
</html>
